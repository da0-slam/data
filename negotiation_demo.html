<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인플루언서 협상 관리 — BRANDSLAM</title>
<meta name="description" content="BRANDSLAM 인플루언서 컨택·협상 관리 대시보드">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#070A0F;
  --s0:#0D1117;
  --s1:#131820;
  --s2:#1A2030;
  --s3:#222A3C;
  --border:#1E2638;
  --border2:#2A3448;
  --accent:#4A6CF0;
  --accent-d:rgba(74,108,240,.14);
  --green:#18C774;
  --green-d:rgba(24,199,116,.13);
  --orange:#F57C35;
  --orange-d:rgba(245,124,53,.13);
  --amber:#F0A500;
  --amber-d:rgba(240,165,0,.12);
  --blue:#36AEFF;
  --blue-d:rgba(54,174,255,.12);
  --violet:#9B7FFF;
  --violet-d:rgba(155,127,255,.12);
  --red:#F04A5A;
  --red-d:rgba(240,74,90,.10);
  --muted:#3E4A60;
  --text:#CDD1DF;
  --text2:#6B7590;
  --text3:#333D55;
  --r:7px;
  --panel-w:360px;
}

html,body{height:100%;overflow:hidden}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Helvetica Neue',system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  font-size:13px;
  line-height:1.4;
  font-variant-numeric:tabular-nums;
}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:0 20px;height:48px;
  background:var(--s0);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  z-index:20;
}

.logo{
  display:flex;align-items:center;gap:8px;flex-shrink:0;text-decoration:none;
}

.logo-mark{
  width:26px;height:26px;border-radius:6px;
  background:var(--accent);
  display:grid;place-items:center;
  font-size:9px;font-weight:900;color:#fff;letter-spacing:-.02em;
  flex-shrink:0;
}

.logo-name{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text2);text-transform:uppercase}

.page-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap}

.campaign-tag{
  font-size:11px;color:var(--text2);
  background:var(--s2);border:1px solid var(--border2);
  padding:3px 10px;border-radius:20px;white-space:nowrap;
}

.spacer{flex:1}

.result-count{
  font-size:12px;color:var(--text2);
  background:var(--s2);padding:3px 12px;border-radius:20px;
  white-space:nowrap;
}

/* ── STATS ── */
.stats{
  display:flex;gap:0;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  background:var(--s0);
}

.sc{
  flex:1;padding:10px 18px;
  display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:background .15s;
  border-right:1px solid var(--border);
}

.sc:last-child{border-right:none}
.sc:hover{background:var(--s1)}
.sc.active{background:var(--s2)}

.sc-ico{
  width:28px;height:28px;border-radius:7px;
  display:grid;place-items:center;font-size:13px;flex-shrink:0;
}

.sc-info{display:flex;flex-direction:column;gap:1px;min-width:0}

.sc-val{font-size:20px;font-weight:700;line-height:1}
.sc-lbl{font-size:10px;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

.sc.all   .sc-ico{background:var(--s3)} .sc.all   .sc-val{color:var(--text)}
.sc.agree .sc-ico{background:var(--green-d)} .sc.agree .sc-val{color:var(--green)}
.sc.nego  .sc-ico{background:var(--orange-d)} .sc.nego  .sc-val{color:var(--orange)}
.sc.app   .sc-ico{background:var(--blue-d)} .sc.app   .sc-val{color:var(--blue)}
.sc.fup   .sc-ico{background:var(--amber-d)} .sc.fup   .sc-val{color:var(--amber)}
.sc.rej   .sc-ico{background:var(--red-d)} .sc.rej   .sc-val{color:var(--red)}

/* ── FILTER ROW ── */
.filter-row{
  display:flex;align-items:center;gap:8px;
  padding:9px 20px;
  background:var(--s1);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  flex-wrap:wrap;
}

.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 13px;border-radius:20px;
  border:1px solid var(--border2);background:transparent;
  color:var(--text2);font-size:12px;cursor:pointer;
  transition:all .16s;white-space:nowrap;font-family:inherit;
}

.chip:hover{border-color:var(--border);color:var(--text);background:var(--s2)}

.chip.active{
  border-color:var(--accent);
  background:var(--accent-d);
  color:var(--accent);font-weight:600;
}

.chip.agree.active  {border-color:var(--green);background:var(--green-d);color:var(--green)}
.chip.nego.active   {border-color:var(--orange);background:var(--orange-d);color:var(--orange)}
.chip.app.active    {border-color:var(--blue);background:var(--blue-d);color:var(--blue)}
.chip.fup.active    {border-color:var(--amber);background:var(--amber-d);color:var(--amber)}
.chip.rej.active    {border-color:var(--red);background:var(--red-d);color:var(--red)}

.vdiv{width:1px;height:18px;background:var(--border2);flex-shrink:0}

.search-wrap{
  position:relative;display:flex;align-items:center;margin-left:auto;
}

.search-icon{
  position:absolute;left:10px;color:var(--text3);font-size:12px;pointer-events:none;
}

.search-input{
  padding:6px 10px 6px 30px;
  background:var(--s0);border:1px solid var(--border2);
  border-radius:var(--r);color:var(--text);
  font-size:12px;font-family:inherit;width:200px;
  outline:none;transition:border-color .15s;
}

.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}

/* ── BODY ── */
.body{
  flex:1;display:flex;min-height:0;
  position:relative;
}

/* ── TABLE ── */
.table-area{
  flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;
  transition:margin-right .25s ease;
}

.table-area.panel-open{margin-right:var(--panel-w)}

.table-wrap{flex:1;overflow-y:auto;overflow-x:auto}

table{
  width:100%;border-collapse:separate;border-spacing:0;
  min-width:680px;
}

thead th{
  position:sticky;top:0;z-index:10;
  background:var(--s0);
  border-bottom:1px solid var(--border);
  padding:8px 14px;
  font-size:10px;font-weight:600;
  letter-spacing:.06em;color:var(--text2);
  text-align:left;text-transform:uppercase;
  white-space:nowrap;
  user-select:none;
}

thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--text);background:var(--s1)}
thead th.sort-asc::after{content:' ↑';color:var(--accent)}
thead th.sort-desc::after{content:' ↓';color:var(--accent)}

thead th:first-child{width:46px;text-align:right;padding-right:8px}

tbody tr{
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .1s;
}

tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr.row-sel{background:rgba(74,108,240,.09)!important}

tbody td{
  padding:11px 14px;
  color:var(--text);vertical-align:middle;
}

tbody td:first-child{
  text-align:right;padding-right:8px;
  color:var(--text3);font-size:11px;
}

.handle-line{display:flex;align-items:center;gap:6px}

.handle{font-size:13px;font-weight:600;color:var(--text)}

.ext-link{
  color:var(--text3);font-size:11px;text-decoration:none;
  padding:1px 4px;border-radius:3px;border:1px solid var(--border2);
  transition:all .14s;line-height:1;flex-shrink:0;
}

.ext-link:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-d)}

.contact-sub{
  font-size:11px;color:var(--text2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;
}

.sbadge{
  display:inline-block;
  padding:3px 9px;border-radius:10px;
  font-size:11px;font-weight:600;letter-spacing:.02em;
  white-space:nowrap;
}

.price-cell{font-size:12px;color:var(--text);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price-cell.after{color:var(--green);font-weight:600}

/* ── PAGINATION ── */
.pag-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 20px;
  background:var(--s0);border-top:1px solid var(--border);
  flex-shrink:0;
  font-size:12px;color:var(--text2);
}

.pag-btn{
  padding:5px 14px;border-radius:var(--r);
  border:1px solid var(--border2);background:var(--s1);
  color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit;
  transition:all .15s;
}

.pag-btn:hover:not(:disabled){background:var(--s2);color:var(--text);border-color:var(--accent)}
.pag-btn:disabled{opacity:.35;cursor:not-allowed}

.pag-pages{display:flex;gap:4px}

.pag-num{
  width:30px;height:26px;border-radius:5px;border:1px solid transparent;
  background:transparent;color:var(--text2);cursor:pointer;font-size:12px;
  display:grid;place-items:center;transition:all .14s;font-family:inherit;
}

.pag-num.cur{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.pag-num:hover:not(.cur){background:var(--s2);color:var(--text)}

.pag-ellipsis{width:24px;display:grid;place-items:center;color:var(--text3)}

/* ── DETAIL PANEL ── */
.detail-panel{
  position:absolute;right:0;top:0;bottom:0;
  width:var(--panel-w);
  background:var(--s0);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .25s ease;
  z-index:15;
  overflow:hidden;
}

.detail-panel.open{transform:translateX(0)}

.detail-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:18px 18px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.detail-handle{font-size:16px;font-weight:700;color:var(--text)}
.detail-platform{font-size:11px;color:var(--text2);margin-top:2px}

.close-btn{
  width:26px;height:26px;border-radius:50%;
  border:1px solid var(--border2);background:var(--s2);
  color:var(--text2);cursor:pointer;font-size:12px;
  display:grid;place-items:center;flex-shrink:0;margin-top:2px;
  transition:all .14s;font-family:inherit;
}

.close-btn:hover{background:var(--red-d);border-color:var(--red);color:var(--red)}

.detail-body{flex:1;overflow-y:auto;padding:0 18px 24px}

.detail-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;padding:14px 0;
  border-bottom:1px solid var(--border);
}

.di-label{font-size:10px;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.di-val{font-size:13px;color:var(--text);font-weight:500}

.detail-sec{padding:14px 0;border-bottom:1px solid var(--border)}
.detail-sec:last-child{border-bottom:none}

.detail-sec-label{
  font-size:10px;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;
  margin-bottom:6px;
}

.detail-sec-val{font-size:13px;color:var(--text);word-break:break-word;line-height:1.6}

.ratecard-box{
  background:var(--s2);border-radius:var(--r);
  padding:10px 12px;
  font-size:12px;color:var(--text2);
  line-height:1.7;white-space:pre-wrap;word-break:break-word;
}

.after-val{
  font-size:15px;font-weight:700;
  color:var(--green);
}

.detail-link{
  font-size:12px;color:var(--accent);
  text-decoration:none;word-break:break-all;line-height:1.5;
  display:block;
}

.detail-link:hover{text-decoration:underline}

.metrics-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-top:2px;
}

.metric-card{
  background:var(--s2);border-radius:var(--r);
  padding:8px 10px;text-align:center;
}

.metric-lbl{font-size:9px;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.metric-val{font-size:15px;font-weight:700;color:var(--text)}

/* ── LOADING / EMPTY ── */
.center-msg{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:80px 20px;color:var(--text2);text-align:center;
}

.spinner{
  width:28px;height:28px;border:2px solid var(--border2);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

/* ── SCROLLBARS ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-mark">BS</div>
    <span class="logo-name">BRANDSLAM</span>
  </div>
  <div style="width:1px;height:18px;background:var(--border);flex-shrink:0"></div>
  <span class="page-title">인플루언서 협상 관리</span>
  <span class="campaign-tag">두피 앰플 캠페인</span>
  <div class="spacer"></div>
  <span class="result-count" id="result-count">로드 중...</span>
</div>

<!-- STATS -->
<div class="stats">
  <div class="sc all active" id="sc-all" onclick="setFilter('all')">
    <div class="sc-ico">👥</div>
    <div class="sc-info"><div class="sc-val" id="st-all">—</div><div class="sc-lbl">후보 전체</div></div>
  </div>
  <div class="sc agree" id="sc-agree" onclick="setFilter('agree')">
    <div class="sc-ico">✓</div>
    <div class="sc-info"><div class="sc-val" id="st-agree">—</div><div class="sc-lbl">동의</div></div>
  </div>
  <div class="sc nego" id="sc-nego" onclick="setFilter('nego')">
    <div class="sc-ico">💬</div>
    <div class="sc-info"><div class="sc-val" id="st-nego">—</div><div class="sc-lbl">협상중</div></div>
  </div>
  <div class="sc app" id="sc-app" onclick="setFilter('app')">
    <div class="sc-ico">📨</div>
    <div class="sc-info"><div class="sc-val" id="st-app">—</div><div class="sc-lbl">접근</div></div>
  </div>
  <div class="sc fup" id="sc-fup" onclick="setFilter('fup')">
    <div class="sc-ico">⏰</div>
    <div class="sc-info"><div class="sc-val" id="st-fup">—</div><div class="sc-lbl">팔로업</div></div>
  </div>
  <div class="sc rej" id="sc-rej" onclick="setFilter('rej')">
    <div class="sc-ico">✕</div>
    <div class="sc-info"><div class="sc-val" id="st-rej">—</div><div class="sc-lbl">거절/기타</div></div>
  </div>
</div>

<!-- FILTERS -->
<div class="filter-row">
  <button class="chip active" id="chip-all"    onclick="setChip('all')">전체</button>
  <button class="chip agree"  id="chip-agree"  onclick="setChip('agree')">동의 (Agree)</button>
  <button class="chip nego"   id="chip-nego"   onclick="setChip('nego')">협상중 (Nego)</button>
  <button class="chip fup"    id="chip-fup"    onclick="setChip('fup')">팔로업 (Follow up)</button>
  <button class="chip app"    id="chip-app"    onclick="setChip('app')">접근 (Approach)</button>
  <div class="vdiv"></div>
  <button class="chip"        id="chip-reply"  onclick="setChip('reply')">회신 (Reply)</button>
  <button class="chip"        id="chip-rc"     onclick="setChip('rc')">단가 제시</button>
  <button class="chip rej"    id="chip-rej"    onclick="setChip('rej')">거절/기타</button>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search" type="text" placeholder="핸들 또는 이메일 검색..." oninput="setSearch(this.value)">
  </div>
</div>

<!-- BODY -->
<div class="body">
  <div class="table-area" id="table-area">
    <div class="table-wrap" id="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th class="sortable" onclick="setSort('handle')">인플루언서</th>
            <th class="sortable" onclick="setSort('followers')">팔로워</th>
            <th class="sortable" onclick="setSort('status')">상태</th>
            <th>단가 (원본)</th>
            <th>협상 후 단가</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6">
            <div class="center-msg"><div class="spinner"></div><div>데이터 로드 중...</div></div>
          </td></tr>
        </tbody>
      </table>
    </div>
    <div class="pag-row" id="pag-row"></div>
  </div>

  <!-- DETAIL PANEL -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-head">
      <div>
        <div class="detail-handle" id="dp-handle">—</div>
        <div class="detail-platform" id="dp-platform"></div>
      </div>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="dp-body"></div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/10LJ7fHfOzwRQYUf851Vo5ZWI25Dlu_zPk9JJKzMbF7k/export?format=csv&gid=0';
const PAGE_SIZE = 60;

// ── STATUS MAP ──────────────────────────────────────────────────────
const SM = {
  'Agree':            {c:'#18C774', bg:'rgba(24,199,116,.14)', k:'agree', lbl:'동의'},
  'Nego':             {c:'#F57C35', bg:'rgba(245,124,53,.14)', k:'nego',  lbl:'협상중'},
  'Follow up':        {c:'#F0A500', bg:'rgba(240,165,0,.14)',  k:'fup',   lbl:'팔로업'},
  'Reply':            {c:'#36AEFF', bg:'rgba(54,174,255,.14)', k:'reply', lbl:'회신'},
  'Give Ratecard':    {c:'#36AEFF', bg:'rgba(54,174,255,.14)', k:'rc',    lbl:'단가 제시'},
  'Question':         {c:'#9B7FFF', bg:'rgba(155,127,255,.14)',k:'q',     lbl:'문의'},
  'Approach Kbeauty': {c:'#5A7090', bg:'rgba(90,112,144,.12)', k:'app',   lbl:'접근'},
  'Approach Staff':   {c:'#5A7090', bg:'rgba(90,112,144,.12)', k:'app',   lbl:'접근(스태프)'},
  'Approach':         {c:'#5A7090', bg:'rgba(90,112,144,.12)', k:'app',   lbl:'접근'},
  'Reject':           {c:'#F04A5A', bg:'rgba(240,74,90,.12)',  k:'rej',   lbl:'거절'},
  'Non USA':          {c:'#F04A5A', bg:'rgba(240,74,90,.12)',  k:'rej',   lbl:'비미국'},
  'Wrong Email':      {c:'#F04A5A', bg:'rgba(240,74,90,.12)',  k:'rej',   lbl:'잘못된 이메일'},
};

function getSC(s){ return SM[s] || {c:'#3E4A60', bg:'rgba(62,74,96,.08)', k:'', lbl: s || '—'}; }

// ── STATE ────────────────────────────────────────────────────────────
let allData      = [];
let filteredData = [];
let activeFilter = 'all';
let searchQ      = '';
let sortCol      = null;
let sortDir      = 1;
let page         = 0;
let selectedIdx  = -1;
let ratecardKey  = null;

// ── PARSE FOLLOWERS ──────────────────────────────────────────────────
function parseFollowers(s){
  if(!s) return 0;
  s = s.trim();
  if(/^\d+,\d+K$/i.test(s)) return Math.round(parseFloat(s.replace(',','.').replace(/K/i,''))*1000);
  s = s.replace(/,/g,'');
  if(/\d+\.?\d*M$/i.test(s)) return Math.round(parseFloat(s)*1000000);
  if(/\d+\.?\d*K$/i.test(s)) return Math.round(parseFloat(s)*1000);
  return parseInt(s)||0;
}

function fmtN(n){
  if(!n) return '—';
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000)    return (n/1000).toFixed(n>=10000?0:1)+'K';
  return String(n);
}

function escHTML(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shortPrice(s){
  if(!s) return '—';
  const first = s.split('\n')[0].trim();
  return first.length > 28 ? first.substring(0,28)+'…' : first || '—';
}

// ── LOAD DATA ─────────────────────────────────────────────────────────
function loadData(){
  Papa.parse(SHEET_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete(res){
      if(!res.data.length){ showEmpty('데이터가 없습니다'); return; }
      const keys = Object.keys(res.data[0]);
      ratecardKey = keys.find(k => k.toLowerCase().includes('ratecard'));

      allData = res.data.map(r => ({
        handle:      (r['Influencer ID [Please do not add @]']||'').trim(),
        url:         (r['URL']||'').trim(),
        followersRaw:(r['Followers']||'').trim(),
        followers:    parseFollowers(r['Followers']||''),
        status:      (r['Status']||'').trim(),
        ratecard:    ratecardKey ? (r[ratecardKey]||'').trim() : '',
        afterNego:   (r['AFTER NEGO']||'').trim(),
        contact:     (r['Contact']||'').trim(),
        contactDM:   (r['Contact DM TT']||'').trim(),
        outreach:    (r['Outreach Date']||'').trim(),
        agreement:   (r['Agreement Date']||'').trim(),
        selection:   (r['Selection']||'').trim(),
        postingTT:   (r['Posting URL (TT)']||'').trim(),
        postingIG:   (r['Posting URL (IG)']||'').trim(),
        views:       (r['Views']||'').trim(),
        likes:       (r['Likes♥']||r['Likes']||'').trim(),
        comments:    (r['Comments']||'').trim(),
        saves:       (r['Saves']||'').trim(),
      })).filter(r => r.handle);

      applyFilter();
      updateStats();
    },
    error(err){
      showEmpty('로드 실패: ' + err.message);
    }
  });
}

// ── STATS ─────────────────────────────────────────────────────────────
function updateStats(){
  const d = allData;
  const agree   = d.filter(r => r.status === 'Agree').length;
  const nego    = d.filter(r => r.status === 'Nego').length;
  const app     = d.filter(r => r.status.startsWith('Approach')).length;
  const fup     = d.filter(r => r.status === 'Follow up').length;
  const rej     = d.filter(r => ['Reject','Non USA','Wrong Email'].includes(r.status)).length;

  set('st-all',   d.length);
  set('st-agree', agree);
  set('st-nego',  nego);
  set('st-app',   app);
  set('st-fup',   fup);
  set('st-rej',   rej);
}

function set(id, v){ const el = document.getElementById(id); if(el) el.textContent = v; }

// ── FILTER / SORT ─────────────────────────────────────────────────────
function applyFilter(){
  let d = [...allData];

  // status filter
  switch(activeFilter){
    case 'agree': d = d.filter(r => r.status === 'Agree'); break;
    case 'nego':  d = d.filter(r => r.status === 'Nego'); break;
    case 'fup':   d = d.filter(r => r.status === 'Follow up'); break;
    case 'app':   d = d.filter(r => r.status.startsWith('Approach')); break;
    case 'reply': d = d.filter(r => r.status === 'Reply'); break;
    case 'rc':    d = d.filter(r => r.status === 'Give Ratecard'); break;
    case 'rej':   d = d.filter(r => ['Reject','Non USA','Wrong Email'].includes(r.status)); break;
  }

  // search
  if(searchQ){
    const q = searchQ.toLowerCase();
    d = d.filter(r => r.handle.toLowerCase().includes(q) || r.contact.toLowerCase().includes(q));
  }

  // sort
  if(sortCol){
    d.sort((a,b)=>{
      const av = sortCol==='followers' ? a.followers : (a[sortCol]||'').toLowerCase();
      const bv = sortCol==='followers' ? b.followers : (b[sortCol]||'').toLowerCase();
      if(typeof av==='number') return (bv-av)*sortDir;
      return av<bv ? -sortDir : av>bv ? sortDir : 0;
    });
  }

  filteredData = d;
  page = 0;
  renderTable();
  renderPag();
  set('result-count', filteredData.length.toLocaleString()+'건');

  // update column sort indicators
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
  });
  if(sortCol){
    const colMap = {handle:1, followers:2, status:3};
    const idx = colMap[sortCol];
    if(idx !== undefined){
      const th = document.querySelectorAll('thead th')[idx];
      if(th) th.classList.add(sortDir===1 ? 'sort-asc' : 'sort-desc');
    }
  }
}

// ── RENDER TABLE ──────────────────────────────────────────────────────
function renderTable(){
  const start = page * PAGE_SIZE;
  const rows  = filteredData.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('tbody');

  if(!rows.length){
    tbody.innerHTML = `<tr><td colspan="6"><div class="center-msg"><div>검색 결과가 없습니다</div></div></td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map((r,i)=>{
    const sc   = getSC(r.status);
    const isel = (start+i) === selectedIdx;
    return `<tr class="${isel?'row-sel':''}" onclick="selectRow(${start+i})">
      <td>${start+i+1}</td>
      <td>
        <div class="handle-line">
          <span class="handle">@${escHTML(r.handle)}</span>
          ${r.url ? `<a class="ext-link" href="${escHTML(r.url)}" target="_blank" onclick="event.stopPropagation()">↗</a>` : ''}
        </div>
        <div class="contact-sub">${escHTML(r.contact)||'—'}</div>
      </td>
      <td>${r.followersRaw || fmtN(r.followers) || '—'}</td>
      <td><span class="sbadge" style="color:${sc.c};background:${sc.bg}">${escHTML(sc.lbl)}</span></td>
      <td class="price-cell">${escHTML(shortPrice(r.ratecard))}</td>
      <td class="price-cell after">${escHTML(shortPrice(r.afterNego))}</td>
    </tr>`;
  }).join('');
}

// ── PAGINATION ────────────────────────────────────────────────────────
function renderPag(){
  const total = Math.ceil(filteredData.length / PAGE_SIZE);
  const el    = document.getElementById('pag-row');
  if(total <= 1){ el.innerHTML=''; return; }

  const start = page*PAGE_SIZE+1;
  const end   = Math.min((page+1)*PAGE_SIZE, filteredData.length);

  // build page buttons (show max 7 page numbers)
  let pages = '';
  const WINDOW = 3;
  for(let p=0; p<total; p++){
    if(p===0 || p===total-1 || (p>=page-WINDOW && p<=page+WINDOW)){
      pages += `<button class="pag-num${p===page?' cur':''}" onclick="goPage(${p})">${p+1}</button>`;
    } else if(p===1 && page-WINDOW>1){
      pages += `<span class="pag-ellipsis">…</span>`;
    } else if(p===total-2 && page+WINDOW<total-2){
      pages += `<span class="pag-ellipsis">…</span>`;
    }
  }

  el.innerHTML = `
    <button class="pag-btn" onclick="goPage(${page-1})" ${page===0?'disabled':''}>← 이전</button>
    <div class="pag-pages">${pages}</div>
    <button class="pag-btn" onclick="goPage(${page+1})" ${page>=total-1?'disabled':''}>다음 →</button>
    <span style="margin-left:auto;color:var(--text2);font-size:11px">${start}–${end} / ${filteredData.length.toLocaleString()}건</span>
  `;
}

function goPage(p){
  const total = Math.ceil(filteredData.length / PAGE_SIZE);
  if(p<0||p>=total) return;
  page = p;
  renderTable();
  renderPag();
  document.getElementById('table-wrap').scrollTop = 0;
}

// ── DETAIL PANEL ──────────────────────────────────────────────────────
function selectRow(idx){
  selectedIdx = idx;
  renderTable();
  const r = filteredData[idx];
  if(!r) return;

  const sc = getSC(r.status);

  document.getElementById('dp-handle').textContent  = '@' + r.handle;
  document.getElementById('dp-platform').innerHTML  =
    `<span class="sbadge" style="color:${sc.c};background:${sc.bg}">${escHTML(sc.lbl)}</span>`;

  const hasMetrics = r.views || r.likes || r.comments || r.saves;

  document.getElementById('dp-body').innerHTML = `
    <div class="detail-grid">
      <div>
        <div class="di-label">팔로워</div>
        <div class="di-val">${escHTML(r.followersRaw) || fmtN(r.followers) || '—'}</div>
      </div>
      <div>
        <div class="di-label">DM 컨택</div>
        <div class="di-val">${r.contactDM==='TRUE'?'✓ 완료':'—'}</div>
      </div>
      <div>
        <div class="di-label">컨택 날짜</div>
        <div class="di-val">${escHTML(r.outreach)||'—'}</div>
      </div>
      <div>
        <div class="di-label">동의 날짜</div>
        <div class="di-val">${escHTML(r.agreement)||'—'}</div>
      </div>
    </div>

    ${r.contact ? `
    <div class="detail-sec">
      <div class="detail-sec-label">이메일</div>
      <div class="detail-sec-val">${escHTML(r.contact)}</div>
    </div>` : ''}

    ${r.ratecard ? `
    <div class="detail-sec">
      <div class="detail-sec-label">단가 카드 (원본)</div>
      <div class="ratecard-box">${escHTML(r.ratecard)}</div>
    </div>` : ''}

    ${r.afterNego ? `
    <div class="detail-sec">
      <div class="detail-sec-label">협상 후 단가</div>
      <div class="after-val">${escHTML(r.afterNego).replace(/\n/g,'<br>')}</div>
    </div>` : ''}

    ${r.url ? `
    <div class="detail-sec">
      <div class="detail-sec-label">프로필 링크</div>
      <a class="detail-link" href="${escHTML(r.url)}" target="_blank">${escHTML(r.url)}</a>
    </div>` : ''}

    ${r.postingTT ? `
    <div class="detail-sec">
      <div class="detail-sec-label">포스팅 URL (TikTok)</div>
      <a class="detail-link" href="${escHTML(r.postingTT)}" target="_blank">${escHTML(r.postingTT)}</a>
    </div>` : ''}

    ${r.postingIG ? `
    <div class="detail-sec">
      <div class="detail-sec-label">포스팅 URL (Instagram)</div>
      <a class="detail-link" href="${escHTML(r.postingIG)}" target="_blank">${escHTML(r.postingIG)}</a>
    </div>` : ''}

    ${hasMetrics ? `
    <div class="detail-sec">
      <div class="detail-sec-label">성과 지표</div>
      <div class="metrics-grid">
        <div class="metric-card"><div class="metric-lbl">조회수</div><div class="metric-val">${escHTML(r.views)||'—'}</div></div>
        <div class="metric-card"><div class="metric-lbl">좋아요</div><div class="metric-val">${escHTML(r.likes)||'—'}</div></div>
        <div class="metric-card"><div class="metric-lbl">댓글</div><div class="metric-val">${escHTML(r.comments)||'—'}</div></div>
        <div class="metric-card"><div class="metric-lbl">저장</div><div class="metric-val">${escHTML(r.saves)||'—'}</div></div>
      </div>
    </div>` : ''}
  `;

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('table-area').classList.add('panel-open');
}

function closeDetail(){
  selectedIdx = -1;
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('table-area').classList.remove('panel-open');
  renderTable();
}

// ── FILTER CONTROLS ───────────────────────────────────────────────────
function setFilter(f){
  activeFilter = f;
  // sync stat cards active state
  ['all','agree','nego','app','fup','rej'].forEach(k=>{
    document.getElementById('sc-'+k)?.classList.toggle('active', k===f);
  });
  // sync chips
  const chipMap = {all:'all',agree:'agree',nego:'nego',app:'app',fup:'fup',rej:'rej'};
  if(chipMap[f]) setChip(chipMap[f]);
  else applyFilter();
}

function setChip(k){
  activeFilter = k;
  // deactivate all chips
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  document.getElementById('chip-'+k)?.classList.add('active');

  // sync stat cards
  const statMap = {all:'all',agree:'agree',nego:'nego',app:'app',fup:'fup',rej:'rej'};
  ['all','agree','nego','app','fup','rej'].forEach(s=>{
    document.getElementById('sc-'+s)?.classList.toggle('active', statMap[k]===s);
  });

  closeDetail();
  applyFilter();
}

function setSearch(q){
  searchQ = q;
  page = 0;
  applyFilter();
}

function setSort(col){
  if(sortCol===col) sortDir *= -1;
  else { sortCol=col; sortDir=1; }
  applyFilter();
}

function showEmpty(msg){
  document.getElementById('tbody').innerHTML =
    `<tr><td colspan="6"><div class="center-msg"><div>${escHTML(msg)}</div></div></td></tr>`;
}

// ── INIT ──────────────────────────────────────────────────────────────
loadData();
</script>
