<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>컨택·협상 자동화 — BRANDSLAM Suite</title>
<meta name="description" content="BRANDSLAM Suite 컨택·협상 자동화 데모 — 인플루언서 협상 파이프라인">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#080B10;
  --s0:#0F1318;
  --s1:#141820;
  --s2:#1C2130;
  --s3:#232840;
  --border:#22283A;
  --border2:#2E3550;
  --accent:#4B6FEE;
  --accent-d:rgba(75,111,238,.14);
  --green:#1EC87A;
  --green-d:rgba(30,200,122,.13);
  --orange:#FF7A35;
  --orange-d:rgba(255,122,53,.13);
  --blue:#38B2FF;
  --blue-d:rgba(56,178,255,.13);
  --red:#FF4D5A;
  --red-d:rgba(255,77,90,.12);
  --muted:#4A5370;
  --text:#D6DAE8;
  --text2:#717A96;
  --text3:#3C4260;
  --r:7px;
}

html,body{height:100%;overflow:hidden}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Helvetica Neue',system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  font-variant-numeric:tabular-nums;
  font-size:13px;
  line-height:1.4;
}

/* ── TOPBAR ── */
.topbar{
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 22px;
  height:50px;
  background:var(--s0);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  flex-shrink:0;
}

.brand-logo{
  width:28px;height:28px;
  background:var(--accent);
  border-radius:7px;
  display:grid;place-items:center;
  font-size:10px;font-weight:900;
  color:#fff;letter-spacing:-.03em;
}

.brand-name{
  font-size:12px;font-weight:700;
  letter-spacing:.07em;
  color:var(--text2);
  text-transform:uppercase;
}

.topbar-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}

.page-title{
  font-size:14px;font-weight:600;
  color:var(--text);
  white-space:nowrap;
}

.campaign-pill{
  font-size:11px;
  color:var(--text2);
  background:var(--s2);
  padding:3px 11px;
  border-radius:20px;
  border:1px solid var(--border);
  white-space:nowrap;
}

.spacer{flex:1}

.rec-badge{
  display:flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;
  letter-spacing:.08em;
  color:var(--red);
  opacity:.75;
  flex-shrink:0;
}

.rec-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:var(--red);
  animation:blink 1.3s step-end infinite;
}

@keyframes blink{50%{opacity:0}}

/* ── STATS ── */
.stats-row{
  display:flex;
  gap:0;
  background:var(--border);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.stat-card{
  flex:1;
  padding:12px 20px;
  background:var(--s0);
  display:flex;
  align-items:center;
  gap:14px;
}

.stat-card+.stat-card{border-left:1px solid var(--border)}

.stat-icon{
  width:32px;height:32px;
  border-radius:8px;
  display:grid;place-items:center;
  font-size:14px;
  flex-shrink:0;
}

.stat-info{display:flex;flex-direction:column;gap:2px}

.stat-label{
  font-size:10px;
  color:var(--text2);
  letter-spacing:.05em;
  text-transform:uppercase;
  white-space:nowrap;
}

.stat-value{
  font-size:22px;font-weight:700;
  line-height:1;
  transition:color .4s;
}

.stat-card.c-all   .stat-icon{background:var(--s2)}
.stat-card.c-all   .stat-value{color:var(--text)}
.stat-card.c-neg   .stat-icon{background:var(--orange-d)}
.stat-card.c-neg   .stat-value{color:var(--orange)}
.stat-card.c-stand .stat-icon{background:var(--green-d)}
.stat-card.c-stand .stat-value{color:var(--green)}
.stat-card.c-done  .stat-icon{background:var(--s2)}
.stat-card.c-done  .stat-value{color:var(--muted)}
.stat-card.c-rej   .stat-icon{background:var(--red-d)}
.stat-card.c-rej   .stat-value{color:var(--red)}

/* ── FILTER ROW ── */
.filter-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 22px;
  background:var(--s1);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  flex-wrap:wrap;
}

.filter-label{
  font-size:10px;
  color:var(--text3);
  letter-spacing:.05em;
  text-transform:uppercase;
  white-space:nowrap;
  flex-shrink:0;
}

.chips{display:flex;gap:5px;flex-wrap:wrap}

.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 13px;
  border-radius:20px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text2);
  font-size:12px;
  cursor:pointer;
  transition:all .18s;
  white-space:nowrap;
  font-family:inherit;
}

.chip:hover{border-color:var(--border2);color:var(--text)}

.chip.active{
  background:var(--accent-d);
  border-color:var(--accent);
  color:var(--accent);
  font-weight:600;
}

.vdiv{width:1px;height:20px;background:var(--border);flex-shrink:0}

.sort-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;
  border-radius:var(--r);
  border:1px solid var(--border);
  background:transparent;
  color:var(--text2);
  font-size:12px;
  cursor:pointer;
  transition:all .18s;
  white-space:nowrap;
  font-family:inherit;
}

.sort-btn:hover,.sort-btn.active{background:var(--s2);color:var(--text);border-color:var(--border2)}

.filter-spacer{flex:1}

.btn-start{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 18px;
  border-radius:var(--r);
  border:none;
  background:var(--accent);
  color:#fff;
  font-size:13px;font-weight:700;
  cursor:pointer;
  transition:all .18s;
  font-family:inherit;
  white-space:nowrap;
  flex-shrink:0;
}

.btn-start:hover{background:#3a5ee0;transform:translateY(-1px);box-shadow:0 4px 16px rgba(75,111,238,.3)}
.btn-start:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

.btn-start.pulse{animation:pulsebtn .55s ease 4}

@keyframes pulsebtn{
  0%,100%{box-shadow:0 0 0 0 rgba(75,111,238,.5);transform:scale(1)}
  50%{box-shadow:0 0 0 10px rgba(75,111,238,0);transform:scale(1.04)}
}

/* ── TABLE ── */
.table-wrap{flex:1;overflow:auto}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  min-width:760px;
}

thead th{
  position:sticky;top:0;
  background:var(--s0);
  border-bottom:1px solid var(--border);
  padding:9px 16px;
  font-size:10px;
  font-weight:600;
  letter-spacing:.06em;
  color:var(--text2);
  text-align:left;
  white-space:nowrap;
  text-transform:uppercase;
  z-index:10;
}

thead th:first-child{width:48px;padding:9px 16px}

tbody tr{
  border-bottom:1px solid var(--border);
  transition:background .12s,opacity .3s;
}

tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr.selected{background:rgba(75,111,238,.07)}
tbody tr.hidden{display:none}

tbody td{
  padding:13px 16px;
  vertical-align:middle;
  color:var(--text);
}

tbody td:first-child{padding:13px 16px}

/* checkbox */
.cb-wrap{display:flex;align-items:center}

.cb{
  width:16px;height:16px;
  border:1.5px solid var(--border2);
  border-radius:4px;
  background:transparent;
  cursor:pointer;
  display:grid;place-items:center;
  transition:all .15s;
  flex-shrink:0;
  position:relative;
}

.cb.checked{background:var(--accent);border-color:var(--accent)}

.cb.checked::after{
  content:'';
  display:block;
  width:9px;height:5px;
  border-left:2px solid #fff;
  border-bottom:2px solid #fff;
  transform:translateY(-1px) rotate(-45deg);
}

/* influencer cell */
.inf-cell{display:flex;flex-direction:column;gap:2px}

.inf-handle{
  font-size:13px;font-weight:600;
  color:var(--text);
}

.inf-meta{
  font-size:11px;color:var(--text2);
  display:flex;align-items:center;gap:8px;
}

.platform-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;
  letter-spacing:.03em;
}

.pdot{
  display:inline-block;
  width:5px;height:5px;
  border-radius:50%;
}

.pdot.TikTok  {background:#ffffff}
.pdot.Instagram{background:#E1306C}
.pdot.YouTube {background:#FF0000}

/* numbers */
.num-big{font-size:13px;color:var(--text)}
.num-sub{font-size:11px;color:var(--text2);margin-top:1px}

.engage-bar{
  display:flex;flex-direction:column;gap:4px;
}

.engage-track{
  width:60px;height:3px;
  background:var(--border2);
  border-radius:2px;
  overflow:hidden;
}

.engage-fill{
  height:100%;
  border-radius:2px;
  background:var(--accent);
  transition:width .4s;
}

.engage-fill.high{background:var(--green)}

/* fee */
.fee-val{font-size:13px;font-weight:600;color:var(--text)}

/* stage */
.stage-cell{display:flex;align-items:center;gap:10px}

.dots{display:flex;gap:4px;align-items:center}

.d{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--border2);
  transition:background .35s,box-shadow .35s;
  flex-shrink:0;
}

.d.past{background:var(--green)}
.d.curr{
  background:var(--orange);
  box-shadow:0 0 0 3px rgba(255,122,53,.2),0 0 8px rgba(255,122,53,.5);
  animation:pdot 1.8s ease infinite;
}
.d.done-all{background:var(--green)}
.d.rejected{background:var(--red)}

@keyframes pdot{
  0%,100%{box-shadow:0 0 0 3px rgba(255,122,53,.2),0 0 8px rgba(255,122,53,.5)}
  50%{box-shadow:0 0 0 4px rgba(255,122,53,.08),0 0 14px rgba(255,122,53,.3)}
}

.stage-badge{
  font-size:11px;font-weight:600;
  padding:3px 9px;
  border-radius:10px;
  letter-spacing:.02em;
  white-space:nowrap;
  transition:background .3s,color .3s;
}

.sb-idle{background:var(--s2);color:var(--text3)}
.sb-c1{background:var(--blue-d);color:var(--blue)}
.sb-c2{background:var(--orange-d);color:var(--orange)}
.sb-c3{background:var(--accent-d);color:var(--accent)}
.sb-c4{background:var(--green-d);color:var(--green);font-weight:700}
.sb-done{background:var(--s2);color:var(--muted)}
.sb-rej{background:var(--red-d);color:var(--red)}

/* ── TOAST ── */
.toast-wrap{
  position:fixed;bottom:72px;right:20px;
  display:flex;flex-direction:column;gap:8px;
  z-index:300;
  pointer-events:none;
}

.toast{
  background:var(--s2);
  border:1px solid var(--border2);
  border-left:3px solid var(--green);
  padding:10px 16px;
  border-radius:var(--r);
  font-size:12px;color:var(--text);
  animation:tIn .22s ease,tOut .22s ease 2.7s forwards;
  max-width:260px;line-height:1.5;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}

.toast.warn{border-left-color:var(--orange)}
.toast.info{border-left-color:var(--blue)}

@keyframes tIn{from{opacity:0;transform:translateX(12px)}}
@keyframes tOut{to{opacity:0;transform:translateX(12px)}}

/* ── PLAYBAR ── */
.playbar{
  display:flex;align-items:center;gap:10px;
  padding:8px 22px;
  background:var(--s0);
  border-top:1px solid var(--border);
  flex-shrink:0;
  height:52px;
}

.pbtn{
  width:30px;height:30px;
  border-radius:50%;
  border:1px solid var(--border2);
  background:var(--s2);
  color:var(--text2);
  cursor:pointer;
  display:grid;place-items:center;
  font-size:11px;
  transition:all .15s;
  flex-shrink:0;
  font-family:inherit;
}

.pbtn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.pbtn.active-play{background:var(--accent);border-color:var(--accent);color:#fff}

.prog-wrap{flex:1;display:flex;align-items:center;gap:10px}

.prog-track{
  flex:1;height:3px;
  background:var(--border2);
  border-radius:2px;
  overflow:visible;
  cursor:pointer;
  position:relative;
}

.prog-fill{
  height:100%;background:var(--accent);
  border-radius:2px;
  transition:width .5s ease;
}

.prog-handle{
  position:absolute;
  right:-5px;top:50%;transform:translateY(-50%);
  width:10px;height:10px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 2px var(--s0);
  pointer-events:none;
}

.time-lbl{
  font-size:11px;color:var(--text2);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  flex-shrink:0;
}

.step-lbl{
  font-size:11px;color:var(--text2);
  background:var(--s2);
  padding:3px 11px;
  border-radius:10px;
  white-space:nowrap;
  max-width:220px;
  overflow:hidden;text-overflow:ellipsis;
  flex-shrink:0;
}

/* row anim */
@keyframes rowFlash{
  0%,100%{background:transparent}
  30%{background:rgba(75,111,238,.18)}
}

.row-flash{animation:rowFlash .5s ease}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">
    <div class="brand-logo">BS</div>
    <span class="brand-name">BRANDSLAM</span>
  </div>
  <div class="topbar-sep"></div>
  <span class="page-title">컨택·협상 자동화</span>
  <div class="campaign-pill">두피 앰플 캠페인</div>
  <div class="spacer"></div>
  <div class="rec-badge"><div class="rec-dot"></div>DEMO REC</div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-card c-all">
    <div class="stat-icon">👥</div>
    <div class="stat-info">
      <div class="stat-label">후보 전체</div>
      <div class="stat-value" id="st-all">12</div>
    </div>
  </div>
  <div class="stat-card c-neg">
    <div class="stat-icon">💬</div>
    <div class="stat-info">
      <div class="stat-label">협상 진행</div>
      <div class="stat-value" id="st-neg">0</div>
    </div>
  </div>
  <div class="stat-card c-stand">
    <div class="stat-icon">✓</div>
    <div class="stat-info">
      <div class="stat-label">스탠바이</div>
      <div class="stat-value" id="st-stand">0</div>
    </div>
  </div>
  <div class="stat-card c-done">
    <div class="stat-icon">📋</div>
    <div class="stat-info">
      <div class="stat-label">완료</div>
      <div class="stat-value" id="st-done">0</div>
    </div>
  </div>
  <div class="stat-card c-rej">
    <div class="stat-icon">✕</div>
    <div class="stat-info">
      <div class="stat-label">거절</div>
      <div class="stat-value" id="st-rej">0</div>
    </div>
  </div>
</div>

<!-- FILTERS -->
<div class="filter-row">
  <span class="filter-label">카테고리</span>
  <div class="chips">
    <button class="chip active" id="chip-all"   onclick="setFilter('all')">전체</button>
    <button class="chip"        id="chip-scalp" onclick="setFilter('두피케어')">두피케어</button>
    <button class="chip"        id="chip-hair"  onclick="setFilter('헤어케어')">헤어케어</button>
  </div>
  <div class="vdiv"></div>
  <button class="sort-btn" id="sort-follow" onclick="setSort('followers')">팔로워 ↓</button>
  <button class="sort-btn" id="sort-engage" onclick="setSort('engage')">참여율 ↓</button>
  <div class="filter-spacer"></div>
  <button class="btn-start" id="btn-start" disabled onclick="startNeg()">+ 협상 시작</button>
</div>

<!-- TABLE -->
<div class="table-wrap">
  <table id="inf-table">
    <thead>
      <tr>
        <th><div class="cb" id="cb-all" onclick="toggleAll()" style="margin:auto"></div></th>
        <th>인플루언서</th>
        <th>팔로워</th>
        <th>참여율</th>
        <th>협의 단가</th>
        <th>진행 단계</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- TOASTS -->
<div class="toast-wrap" id="toasts"></div>

<!-- PLAYBAR -->
<div class="playbar">
  <button class="pbtn" onclick="prevStep()" title="이전">◀</button>
  <button class="pbtn" id="play-btn" onclick="togglePlay()">▶</button>
  <button class="pbtn" onclick="nextStep()" title="다음">▶▶</button>
  <div class="prog-wrap">
    <div class="prog-track" onclick="seekDemo(event)">
      <div class="prog-fill" id="prog-fill"></div>
      <div class="prog-handle" id="prog-handle" style="display:none"></div>
    </div>
  </div>
  <span class="time-lbl" id="time-lbl">0:00 / 3:00</span>
  <span class="step-lbl" id="step-lbl">전체 후보 로드</span>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const INF = [
  {id:1,  handle:'@scalp_unni',   name:'두피언니',     platform:'TikTok',     cat:'두피케어', followers:342000, engage:5.8, fee:'₩ 120만'},
  {id:2,  handle:'@hairlab_kr',   name:'헤어랩',       platform:'Instagram',  cat:'두피케어', followers:128000, engage:4.2, fee:'₩ 85만'},
  {id:3,  handle:'@kbeauty_hair', name:'케이뷰티헤어', platform:'TikTok',     cat:'두피케어', followers:287000, engage:5.1, fee:'₩ 105만'},
  {id:4,  handle:'@dailyhair_j',  name:'데일리헤어',   platform:'Instagram',  cat:'두피케어', followers:52000,  engage:6.1, fee:'₩ 40만'},
  {id:5,  handle:'@scalp_pro',    name:'두피전문가',   platform:'YouTube',    cat:'두피케어', followers:156000, engage:3.7, fee:'₩ 150만'},
  {id:6,  handle:'@beauty_farm',  name:'뷰티팜',       platform:'Instagram',  cat:'두피케어', followers:33000,  engage:7.8, fee:'₩ 30만'},
  {id:7,  handle:'@hair_science', name:'헤어사이언스', platform:'Instagram',  cat:'두피케어', followers:195000, engage:3.9, fee:'₩ 130만'},
  {id:8,  handle:'@beautymd_hn',  name:'뷰티MD현남',   platform:'YouTube',    cat:'헤어케어', followers:89000,  engage:3.1, fee:'₩ 200만'},
  {id:9,  handle:'@hair_diary',   name:'헤어다이어리', platform:'Instagram',  cat:'헤어케어', followers:67000,  engage:5.4, fee:'₩ 55만'},
  {id:10, handle:'@daily_mane',   name:'데일리메인',   platform:'TikTok',     cat:'헤어케어', followers:445000, engage:6.3, fee:'₩ 180만'},
  {id:11, handle:'@mane_story',   name:'메인스토리',   platform:'YouTube',    cat:'헤어케어', followers:78000,  engage:4.4, fee:'₩ 110만'},
  {id:12, handle:'@kocbeauty',    name:'코크뷰티',     platform:'TikTok',     cat:'두피케어', followers:210000, engage:4.9, fee:'₩ 95만'},
];

// ── STATE ─────────────────────────────────────────────────────────────────────
let activeFilter = 'all';
let activeSort   = null;
let selected     = new Set();
// stage: 0=idle, 1=1차컨택, 2=조건협의, 3=최종확인, 4=스탠바이, 5=완료, -1=거절
let stages       = {};
INF.forEach(r => { stages[r.id] = 0; });

let demoStep  = 0;
let playing   = false;
let autoTimer = null;

// ── DEMO SEQUENCE ──────────────────────────────────────────────────────────────
const STEPS = [
  {
    t: 0,
    label: '전체 후보 로드',
    action() {}
  },
  {
    t: 18,
    label: '두피케어 필터 적용',
    action() {
      setFilter('두피케어', true);
      toast('두피케어 카테고리 필터 적용됨', 'info');
    }
  },
  {
    t: 42,
    label: '팔로워 기준 정렬',
    action() {
      setSort('followers', true);
      toast('팔로워 수 기준 내림차순 정렬', 'info');
    }
  },
  {
    t: 66,
    label: '조건 맞는 인플루언서 선택',
    action() {
      selectIds([1, 3, 12, 2], true);
    }
  },
  {
    t: 95,
    label: '협상 시작 — 1차 컨택 발송',
    action() {
      document.getElementById('btn-start').classList.add('pulse');
      setTimeout(() => {
        document.getElementById('btn-start').classList.remove('pulse');
        startNeg(true);
      }, 600);
    }
  },
  {
    t: 120,
    label: '조건 회신 수신',
    action() {
      [1, 3].forEach(id => setStage(id, 2));
      toast('@scalp_unni, @kbeauty_hair 조건 회신 도착', 'warn');
    }
  },
  {
    t: 148,
    label: '최종 확인 진행 중',
    action() {
      setStage(1, 3);
      setStage(12, 2);
      toast('@scalp_unni 최종 조건 확인 단계', 'info');
    }
  },
  {
    t: 168,
    label: '스탠바이 확정',
    action() {
      setStage(1,  4);
      setStage(3,  4);
      setStage(2,  3);
      toast('@scalp_unni @kbeauty_hair — 스탠바이 전환 완료 ✓');
      updateStats();
    }
  },
  {
    t: 180,
    label: '협상 완료 — 스탠바이 4명 확보',
    action() {
      setStage(2,  4);
      setStage(12, 4);
      setStage(4, -1);
      toast('스탠바이 4명 확보 완료. 캠페인 실행 가능 상태', 'info');
      updateStats();
    }
  },
];

const TOTAL_SEC = 180;

// ── RENDER ────────────────────────────────────────────────────────────────────
function fmtFollowers(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000)    return Math.round(n/1000) + 'K';
  return n;
}

function stageInfo(s) {
  const map = {
    0:  {cls:'sb-idle', label:'—'},
    1:  {cls:'sb-c1',   label:'1차 컨택'},
    2:  {cls:'sb-c2',   label:'조건 협의'},
    3:  {cls:'sb-c3',   label:'최종 확인'},
    4:  {cls:'sb-c4',   label:'스탠바이'},
    5:  {cls:'sb-done', label:'완료'},
    [-1]:{cls:'sb-rej', label:'거절'},
  };
  return map[s] || map[0];
}

function makeDots(stage) {
  const total = 4;
  return Array.from({length: total}, (_, i) => {
    const stageNum = i + 1;
    let cls = '';
    if (stage === -1) cls = 'rejected';
    else if (stage >= 4) cls = 'done-all';
    else if (stageNum < stage) cls = 'past';
    else if (stageNum === stage) cls = 'curr';
    return `<div class="d ${cls}"></div>`;
  }).join('');
}

function renderTable() {
  let list = [...INF];

  if (activeFilter !== 'all') {
    list = list.filter(r => r.cat === activeFilter);
  }

  if (activeSort === 'followers') {
    list.sort((a, b) => b.followers - a.followers);
  } else if (activeSort === 'engage') {
    list.sort((a, b) => b.engage - a.engage);
  }

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = list.map((r, ri) => {
    const isSel = selected.has(r.id);
    const s     = stages[r.id];
    const si    = stageInfo(s);
    const ePct  = Math.round(r.engage / 10 * 100);
    const isHigh = r.engage >= 5;

    return `<tr id="row-${r.id}" class="${isSel ? 'selected' : ''}" style="animation-delay:${ri*35}ms">
      <td><div class="cb-wrap"><div class="cb ${isSel?'checked':''}" onclick="toggleRow(${r.id})"></div></div></td>
      <td>
        <div class="inf-cell">
          <div class="inf-handle">${r.handle}</div>
          <div class="inf-meta">
            <span class="platform-badge"><span class="pdot ${r.platform}"></span>${r.platform}</span>
            <span>${r.cat}</span>
          </div>
        </div>
      </td>
      <td>
        <div class="num-big">${fmtFollowers(r.followers)}</div>
      </td>
      <td>
        <div class="engage-bar">
          <div class="num-big">${r.engage}%</div>
          <div class="engage-track"><div class="engage-fill ${isHigh?'high':''}" style="width:${ePct}%"></div></div>
        </div>
      </td>
      <td><div class="fee-val">${r.fee}</div></td>
      <td>
        <div class="stage-cell">
          <div class="dots">${makeDots(s)}</div>
          <span class="stage-badge ${si.cls}">${si.label}</span>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function updateStats() {
  const vals = Object.values(stages);
  document.getElementById('st-all').textContent   = INF.length;
  document.getElementById('st-neg').textContent   = vals.filter(v => v >= 1 && v <= 3).length;
  document.getElementById('st-stand').textContent = vals.filter(v => v === 4).length;
  document.getElementById('st-done').textContent  = vals.filter(v => v === 5).length;
  document.getElementById('st-rej').textContent   = vals.filter(v => v === -1).length;
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function setFilter(f, silent) {
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  const map = {all:'chip-all', '두피케어':'chip-scalp', '헤어케어':'chip-hair'};
  document.getElementById(map[f])?.classList.add('active');
  renderTable();
  if (!silent) updateStartBtn();
}

function setSort(key, silent) {
  activeSort = (activeSort === key) ? null : key;
  document.getElementById('sort-follow').classList.toggle('active', activeSort === 'followers');
  document.getElementById('sort-engage').classList.toggle('active',  activeSort === 'engage');
  renderTable();
}

function toggleRow(id) {
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
  renderTable();
  updateStartBtn();
}

function toggleAll() {
  const visible = [...INF].filter(r => activeFilter === 'all' || r.cat === activeFilter);
  const allSel  = visible.every(r => selected.has(r.id));
  if (allSel) visible.forEach(r => selected.delete(r.id));
  else        visible.forEach(r => selected.add(r.id));
  renderTable();
  updateStartBtn();
}

function selectIds(ids, animated) {
  if (!animated) {
    ids.forEach(id => selected.add(id));
    renderTable();
    updateStartBtn();
    return;
  }
  let i = 0;
  const go = () => {
    if (i >= ids.length) { updateStartBtn(); return; }
    selected.add(ids[i]);
    const row = document.getElementById(`row-${ids[i]}`);
    if (row) row.classList.add('row-flash');
    renderTable();
    i++;
    setTimeout(go, 380);
  };
  go();
}

function updateStartBtn() {
  const btn = document.getElementById('btn-start');
  btn.disabled = selected.size === 0;
}

function setStage(id, s) {
  stages[id] = s;
  const row = document.getElementById(`row-${id}`);
  if (row) {
    row.classList.add('row-flash');
    const dotsEl  = row.querySelector('.dots');
    const badgeEl = row.querySelector('.stage-badge');
    if (dotsEl)  dotsEl.innerHTML  = makeDots(s);
    if (badgeEl) {
      const si = stageInfo(s);
      badgeEl.className = `stage-badge ${si.cls}`;
      badgeEl.textContent = si.label;
    }
    setTimeout(() => row.classList.remove('row-flash'), 600);
  }
  updateStats();
}

function startNeg(silent) {
  if (selected.size === 0) return;
  selected.forEach(id => {
    if (stages[id] === 0) setStage(id, 1);
  });
  if (!silent) toast(`${selected.size}명에게 협상 메시지 발송 완료`);
  updateStats();
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg, type) {
  const wrap = document.getElementById('toasts');
  const el   = document.createElement('div');
  el.className = `toast${type ? ' ' + type : ''}`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ── DEMO PLAYBACK ─────────────────────────────────────────────────────────────
let elapsed   = 0;
let tickTimer = null;

function applyStep(idx) {
  demoStep = Math.max(0, Math.min(idx, STEPS.length - 1));
  const step = STEPS[demoStep];
  elapsed = step.t;
  step.action();
  updatePlayUI();
}

function updatePlayUI() {
  const pct = Math.min(elapsed / TOTAL_SEC * 100, 100);
  document.getElementById('prog-fill').style.width  = pct + '%';
  document.getElementById('prog-handle').style.display = 'block';
  document.getElementById('prog-handle').style.left = `calc(${pct}% - 5px)`;

  const m = Math.floor(elapsed / 60);
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('time-lbl').textContent = `${m}:${s} / 3:00`;
  document.getElementById('step-lbl').textContent = STEPS[demoStep].label;
}

function prevStep() {
  stopPlay();
  if (demoStep > 0) applyStep(demoStep - 1);
}

function nextStep() {
  stopPlay();
  if (demoStep < STEPS.length - 1) applyStep(demoStep + 1);
}

function togglePlay() {
  playing ? stopPlay() : startPlay();
}

function startPlay() {
  playing = true;
  document.getElementById('play-btn').textContent = '⏸';
  document.getElementById('play-btn').classList.add('active-play');

  tickTimer = setInterval(() => {
    elapsed++;
    if (elapsed > TOTAL_SEC) { stopPlay(); elapsed = TOTAL_SEC; updatePlayUI(); return; }

    // check if next step should fire
    if (demoStep < STEPS.length - 1) {
      const next = STEPS[demoStep + 1];
      if (elapsed >= next.t) {
        demoStep++;
        next.action();
      }
    }
    updatePlayUI();
  }, 1000);
}

function stopPlay() {
  playing = false;
  clearInterval(tickTimer);
  tickTimer = null;
  document.getElementById('play-btn').textContent = '▶';
  document.getElementById('play-btn').classList.remove('active-play');
}

function seekDemo(e) {
  const track = e.currentTarget;
  const rect  = track.getBoundingClientRect();
  const pct   = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const target = Math.round(pct * TOTAL_SEC);
  stopPlay();

  // reset to base state then fast-forward
  selected.clear();
  INF.forEach(r => { stages[r.id] = 0; });
  activeFilter = 'all'; setFilter('all', true);
  activeSort = null;

  let lastStep = 0;
  for (let i = 0; i < STEPS.length; i++) {
    if (STEPS[i].t <= target) { lastStep = i; STEPS[i].action(); }
    else break;
  }
  demoStep = lastStep;
  elapsed  = target;
  renderTable();
  updateStats();
  updatePlayUI();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderTable();
updateStats();
updatePlayUI();
</script>
