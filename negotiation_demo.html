<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인플루언서 협상 관리 — BRANDSLAM</title>
<meta name="description" content="BRANDSLAM 인플루언서 컨택·협상 관리 대시보드">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#F2F4F8;
  --s0:#FFFFFF;
  --s1:#F7F9FC;
  --s2:#EEF1F8;
  --border:#E0E5EF;
  --border2:#CDD4E3;
  --accent:#4A6CF0;
  --accent-d:rgba(74,108,240,.10);
  --accent-t:rgba(74,108,240,.06);
  --green:#0FA65C;
  --green-d:rgba(15,166,92,.10);
  --orange:#E06820;
  --orange-d:rgba(224,104,32,.10);
  --amber:#C28800;
  --amber-d:rgba(194,136,0,.10);
  --blue:#0888D0;
  --blue-d:rgba(8,136,208,.10);
  --violet:#7052CC;
  --violet-d:rgba(112,82,204,.10);
  --red:#D63045;
  --red-d:rgba(214,48,69,.08);
  --muted:#8A96AD;
  --text:#1A2235;
  --text2:#5A6480;
  --text3:#9AA5BC;
  --r:8px;
  --panel-w:380px;
  --topbar-h:54px;
  --stats-h:64px;
  --filter-h:50px;
}

html,body{height:100%;overflow:hidden}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Helvetica Neue',system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  font-size:13px;
  line-height:1.4;
  font-variant-numeric:tabular-nums;
}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:0 22px;height:var(--topbar-h);
  background:var(--s0);
  border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:30;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}

.logo{display:flex;align-items:center;gap:9px;flex-shrink:0;text-decoration:none}

.logo-mark{
  width:28px;height:28px;border-radius:7px;
  background:var(--accent);
  display:grid;place-items:center;
  font-size:10px;font-weight:900;color:#fff;letter-spacing:-.02em;
}

.logo-name{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text2);text-transform:uppercase}

.topbar-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}

.page-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap}

.campaign-tag{
  font-size:11px;color:var(--text2);
  background:var(--s2);border:1px solid var(--border);
  padding:3px 11px;border-radius:20px;white-space:nowrap;
}

.spacer{flex:1}

.result-lbl{
  font-size:12px;font-weight:600;color:var(--text2);
  background:var(--s2);padding:4px 13px;border-radius:20px;
  border:1px solid var(--border);white-space:nowrap;
}

/* ── STATS ── */
.stats{
  display:flex;
  border-bottom:1px solid var(--border);
  flex-shrink:0;background:var(--s0);
}

.sc{
  flex:1;padding:0 20px;height:var(--stats-h);
  display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:background .14s;
  border-right:1px solid var(--border);
}
.sc:last-child{border-right:none}
.sc:hover{background:var(--s1)}
.sc.active{background:var(--accent-t)}

.sc-ico{
  width:32px;height:32px;border-radius:9px;
  display:grid;place-items:center;font-size:15px;flex-shrink:0;
}

.sc-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.sc-val{font-size:22px;font-weight:700;line-height:1;transition:color .3s}
.sc-lbl{font-size:10px;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

.sc.all   .sc-ico{background:#EEF1F8} .sc.all   .sc-val{color:var(--text)}
.sc.agree .sc-ico{background:var(--green-d)} .sc.agree .sc-val{color:var(--green)}
.sc.nego  .sc-ico{background:var(--orange-d)} .sc.nego  .sc-val{color:var(--orange)}
.sc.app   .sc-ico{background:var(--blue-d)} .sc.app   .sc-val{color:var(--blue)}
.sc.fup   .sc-ico{background:var(--amber-d)} .sc.fup   .sc-val{color:var(--amber)}
.sc.rej   .sc-ico{background:var(--red-d)} .sc.rej   .sc-val{color:var(--red)}

/* ── FILTER ROW ── */
.filter-row{
  display:flex;align-items:center;gap:7px;
  padding:0 22px;height:var(--filter-h);
  background:var(--s0);
  border-bottom:1px solid var(--border);
  flex-shrink:0;flex-wrap:nowrap;overflow-x:auto;
}

.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 14px;border-radius:20px;
  border:1.5px solid var(--border);background:transparent;
  color:var(--text2);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;
  font-family:inherit;flex-shrink:0;
}

.chip:hover{border-color:var(--border2);color:var(--text);background:var(--s2)}

.chip.active{border-color:var(--accent);background:var(--accent-d);color:var(--accent);font-weight:600}
.chip.agree.active{border-color:var(--green);background:var(--green-d);color:var(--green)}
.chip.nego.active {border-color:var(--orange);background:var(--orange-d);color:var(--orange)}
.chip.app.active  {border-color:var(--blue);background:var(--blue-d);color:var(--blue)}
.chip.fup.active  {border-color:var(--amber);background:var(--amber-d);color:var(--amber)}
.chip.rej.active  {border-color:var(--red);background:var(--red-d);color:var(--red)}

.vdiv{width:1px;height:20px;background:var(--border);flex-shrink:0}

.search-wrap{position:relative;flex-shrink:0;margin-left:auto}

.search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--text3);font-size:12px;pointer-events:none;
}

.search-input{
  padding:7px 10px 7px 30px;
  background:var(--s2);border:1.5px solid var(--border);
  border-radius:var(--r);color:var(--text);
  font-size:12px;font-family:inherit;width:210px;
  outline:none;transition:border-color .15s,background .15s;
}

.search-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-t)}
.search-input::placeholder{color:var(--text3)}

/* ── BODY ── */
.body{flex:1;display:flex;min-height:0;position:relative}

.table-area{
  flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;
  transition:margin-right .25s cubic-bezier(.4,0,.2,1);
}

.table-area.panel-open{margin-right:var(--panel-w)}

.table-wrap{flex:1;overflow-y:auto;overflow-x:auto;background:var(--bg)}

table{
  width:100%;border-collapse:separate;border-spacing:0;
  min-width:700px;
}

thead th{
  position:sticky;top:0;z-index:10;
  background:var(--s0);
  border-bottom:2px solid var(--border);
  padding:9px 14px;
  font-size:10px;font-weight:700;
  letter-spacing:.06em;color:var(--text2);
  text-align:left;text-transform:uppercase;
  white-space:nowrap;user-select:none;
  box-shadow:0 1px 0 var(--border);
}

thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--text)}
thead th.sort-asc::after{content:' ↑';color:var(--accent)}
thead th.sort-desc::after{content:' ↓';color:var(--accent)}

thead th:first-child{width:46px;text-align:right;padding-right:10px}

tbody tr{
  background:var(--s0);
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .1s;
}

tbody tr:hover{background:var(--s1)}
tbody tr.row-sel{background:var(--accent-t)!important;outline:none}
tbody tr.row-sel td:first-child{border-left:3px solid var(--accent)}

tbody td{
  padding:10px 14px;
  color:var(--text);
  vertical-align:middle;
}

tbody td:first-child{
  text-align:right;padding-right:10px;
  color:var(--text3);font-size:11px;
  padding-left:10px;
}

/* ── AVATAR ── */
.av-cell{display:flex;align-items:center;gap:11px}

.av{
  width:38px;height:38px;border-radius:50%;
  flex-shrink:0;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;
  border:2px solid var(--border);
  background:var(--s2);
  color:var(--text2);
}

.av img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;border-radius:50%;
  transition:opacity .2s;
}

.av-info{min-width:0;flex:1}

.handle{
  font-size:13px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:6px;
}

.handle a{
  color:var(--text3);font-size:11px;text-decoration:none;
  padding:1px 5px;border-radius:4px;border:1px solid var(--border);
  transition:all .13s;line-height:1.3;
}

.handle a:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-t)}

.contact-sub{
  font-size:11px;color:var(--text2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;
}

.sbadge{
  display:inline-block;padding:3px 9px;border-radius:10px;
  font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap;
}

.price-cell{font-size:12px;color:var(--text);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price-cell.after{color:var(--green);font-weight:700}

/* ── PAGINATION ── */
.pag-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 22px;
  background:var(--s0);border-top:1px solid var(--border);
  flex-shrink:0;font-size:12px;color:var(--text2);
}

.pag-btn{
  padding:5px 14px;border-radius:var(--r);
  border:1.5px solid var(--border);background:var(--s0);
  color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit;
  transition:all .14s;font-weight:500;
}

.pag-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-t)}
.pag-btn:disabled{opacity:.35;cursor:not-allowed}

.pag-pages{display:flex;gap:3px}

.pag-num{
  width:30px;height:28px;border-radius:6px;
  border:1px solid transparent;background:transparent;
  color:var(--text2);cursor:pointer;font-size:12px;
  display:grid;place-items:center;transition:all .13s;font-family:inherit;
}

.pag-num.cur{background:var(--accent);color:#fff;font-weight:700}
.pag-num:hover:not(.cur){background:var(--s2);color:var(--text)}
.pag-ellipsis{width:24px;display:grid;place-items:center;color:var(--text3)}

/* ── DETAIL PANEL ── */
.detail-panel{
  position:absolute;right:0;top:0;bottom:0;
  width:var(--panel-w);
  background:var(--s0);
  border-left:1px solid var(--border);
  box-shadow:-4px 0 24px rgba(0,0,0,.07);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  z-index:20;overflow:hidden;
}

.detail-panel.open{transform:translateX(0)}

.detail-head{
  display:flex;align-items:flex-start;gap:14px;
  padding:20px 20px 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.detail-av{
  width:56px;height:56px;border-radius:50%;
  flex-shrink:0;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;
  border:2px solid var(--border);
  background:var(--s2);color:var(--text2);
}

.detail-av img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
}

.detail-meta{flex:1;min-width:0}
.detail-handle{font-size:16px;font-weight:700;color:var(--text)}
.detail-sub{font-size:11px;color:var(--text2);margin-top:3px}

.close-btn{
  width:28px;height:28px;border-radius:50%;margin-top:2px;
  border:1.5px solid var(--border);background:var(--s2);
  color:var(--text2);cursor:pointer;font-size:12px;
  display:grid;place-items:center;flex-shrink:0;
  transition:all .13s;font-family:inherit;
}

.close-btn:hover{background:var(--red-d);border-color:var(--red);color:var(--red)}

.dp-body{flex:1;overflow-y:auto;padding:0 20px 28px}

.dp-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding:16px 0;border-bottom:1px solid var(--border);
}

.dg-label{font-size:10px;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.dg-val{font-size:13px;font-weight:500;color:var(--text)}

.dp-sec{padding:14px 0;border-bottom:1px solid var(--border)}
.dp-sec:last-child{border-bottom:none}
.dp-sec-label{font-size:10px;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.dp-sec-val{font-size:13px;color:var(--text);word-break:break-word;line-height:1.6}

.ratecard-box{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 13px;
  font-size:12px;color:var(--text2);
  line-height:1.7;white-space:pre-wrap;word-break:break-word;
}

.after-price{
  font-size:17px;font-weight:700;color:var(--green);
}

.dp-link{
  font-size:12px;color:var(--accent);text-decoration:none;
  word-break:break-all;line-height:1.6;display:block;
  transition:opacity .13s;
}

.dp-link:hover{opacity:.75;text-decoration:underline}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:2px}

.metric{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:9px 10px;text-align:center;
}

.metric-lbl{font-size:9px;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.metric-val{font-size:15px;font-weight:700;color:var(--text)}

/* ── LOADING ── */
.center-msg{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:80px 20px;color:var(--text2);text-align:center;
}

.spinner{
  width:30px;height:30px;border:2.5px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

/* ── SCROLLBARS ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-mark">BS</div>
    <span class="logo-name">BRANDSLAM</span>
  </div>
  <div class="topbar-sep"></div>
  <span class="page-title">인플루언서 협상 관리</span>
  <span class="campaign-tag">두피 앰플 캠페인</span>
  <div class="spacer"></div>
  <span class="result-lbl" id="result-lbl">로드 중...</span>
</div>

<!-- STATS -->
<div class="stats">
  <div class="sc all active" id="sc-all" onclick="setFilter('all')">
    <div class="sc-ico">👥</div>
    <div class="sc-info"><div class="sc-val" id="st-all">—</div><div class="sc-lbl">전체</div></div>
  </div>
  <div class="sc agree" id="sc-agree" onclick="setFilter('agree')">
    <div class="sc-ico">✓</div>
    <div class="sc-info"><div class="sc-val" id="st-agree">—</div><div class="sc-lbl">동의</div></div>
  </div>
  <div class="sc nego" id="sc-nego" onclick="setFilter('nego')">
    <div class="sc-ico">💬</div>
    <div class="sc-info"><div class="sc-val" id="st-nego">—</div><div class="sc-lbl">협상중</div></div>
  </div>
  <div class="sc app" id="sc-app" onclick="setFilter('app')">
    <div class="sc-ico">📨</div>
    <div class="sc-info"><div class="sc-val" id="st-app">—</div><div class="sc-lbl">접근</div></div>
  </div>
  <div class="sc fup" id="sc-fup" onclick="setFilter('fup')">
    <div class="sc-ico">⏰</div>
    <div class="sc-info"><div class="sc-val" id="st-fup">—</div><div class="sc-lbl">팔로업</div></div>
  </div>
  <div class="sc rej" id="sc-rej" onclick="setFilter('rej')">
    <div class="sc-ico">✕</div>
    <div class="sc-info"><div class="sc-val" id="st-rej">—</div><div class="sc-lbl">거절/기타</div></div>
  </div>
</div>

<!-- FILTERS -->
<div class="filter-row">
  <button class="chip active" id="chip-all"   onclick="setChip('all')">전체</button>
  <button class="chip agree"  id="chip-agree" onclick="setChip('agree')">동의</button>
  <button class="chip nego"   id="chip-nego"  onclick="setChip('nego')">협상중</button>
  <button class="chip fup"    id="chip-fup"   onclick="setChip('fup')">팔로업</button>
  <button class="chip app"    id="chip-app"   onclick="setChip('app')">접근</button>
  <div class="vdiv"></div>
  <button class="chip"        id="chip-reply" onclick="setChip('reply')">회신</button>
  <button class="chip"        id="chip-rc"    onclick="setChip('rc')">단가 제시</button>
  <button class="chip rej"    id="chip-rej"   onclick="setChip('rej')">거절/기타</button>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search" type="text" placeholder="핸들 또는 이메일 검색..." oninput="setSearch(this.value)">
  </div>
</div>

<!-- BODY -->
<div class="body">
  <div class="table-area" id="table-area">
    <div class="table-wrap" id="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th class="sortable" onclick="setSort('handle')">인플루언서</th>
            <th class="sortable" onclick="setSort('followers')">팔로워</th>
            <th class="sortable" onclick="setSort('status')">상태</th>
            <th>단가 (원본)</th>
            <th>협상 후 단가</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6">
            <div class="center-msg"><div class="spinner"></div><div>데이터 로드 중...</div></div>
          </td></tr>
        </tbody>
      </table>
    </div>
    <div class="pag-row" id="pag-row"></div>
  </div>

  <!-- DETAIL PANEL -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-head">
      <div class="detail-av" id="dp-av"></div>
      <div class="detail-meta">
        <div class="detail-handle" id="dp-handle">—</div>
        <div class="detail-sub" id="dp-sub"></div>
      </div>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
    <div class="dp-body" id="dp-body"></div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/10LJ7fHfOzwRQYUf851Vo5ZWI25Dlu_zPk9JJKzMbF7k/export?format=csv&gid=0';
const PAGE_SIZE = 60;
const THUMB_BASE = 'https://unavatar.io/tiktok/';

// ── STATUS MAP ────────────────────────────────────────────────────────────────
const SM = {
  'Agree':            {c:'#0FA65C', bg:'rgba(15,166,92,.11)',  k:'agree', lbl:'동의'},
  'Nego':             {c:'#E06820', bg:'rgba(224,104,32,.11)', k:'nego',  lbl:'협상중'},
  'Follow up':        {c:'#C28800', bg:'rgba(194,136,0,.11)',  k:'fup',   lbl:'팔로업'},
  'Reply':            {c:'#0888D0', bg:'rgba(8,136,208,.11)',  k:'reply', lbl:'회신'},
  'Give Ratecard':    {c:'#0888D0', bg:'rgba(8,136,208,.11)',  k:'rc',    lbl:'단가 제시'},
  'Question':         {c:'#7052CC', bg:'rgba(112,82,204,.11)', k:'q',     lbl:'문의'},
  'Approach Kbeauty': {c:'#5A6480', bg:'rgba(90,100,128,.09)',  k:'app',   lbl:'접근'},
  'Approach Staff':   {c:'#5A6480', bg:'rgba(90,100,128,.09)',  k:'app',   lbl:'접근(스태프)'},
  'Approach':         {c:'#5A6480', bg:'rgba(90,100,128,.09)',  k:'app',   lbl:'접근'},
  'Reject':           {c:'#D63045', bg:'rgba(214,48,69,.09)',  k:'rej',   lbl:'거절'},
  'Non USA':          {c:'#D63045', bg:'rgba(214,48,69,.09)',  k:'rej',   lbl:'비미국'},
  'Wrong Email':      {c:'#D63045', bg:'rgba(214,48,69,.09)',  k:'rej',   lbl:'잘못된 이메일'},
};

function getSC(s){ return SM[s] || {c:'#8A96AD', bg:'rgba(138,150,173,.09)', k:'', lbl: s||'—'}; }

// ── AVATAR HELPERS ────────────────────────────────────────────────────────────
function avColor(handle){
  const PALETTES = [
    ['#4A6CF0','#EEF2FD'],['#0FA65C','#E8FAF3'],['#E06820','#FDF0E8'],
    ['#C28800','#FDF8E8'],['#0888D0','#E8F5FD'],['#7052CC','#F2EEF8'],
    ['#D63045','#FDEEF0'],['#2CA8A0','#E8F9F8'],
  ];
  const i = handle.split('').reduce((a,c)=>a+c.charCodeAt(0),0) % PALETTES.length;
  return PALETTES[i];
}

function avInit(handle){
  return (handle||'').replace('@','').charAt(0).toUpperCase() || '?';
}

function avHtml(handle, size){
  const [fg, bg] = avColor(handle);
  const init = avInit(handle);
  const cls  = size === 'lg' ? 'detail-av' : 'av';
  return `style="background:${bg};color:${fg}">${init}<img src="${THUMB_BASE}${encodeURIComponent(handle)}" alt="" loading="lazy" onerror="this.style.display='none'">`;
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let allData      = [];
let filteredData = [];
let activeFilter = 'all';
let searchQ      = '';
let sortCol      = null;
let sortDir      = 1;
let page         = 0;
let selectedIdx  = -1;
let ratecardKey  = null;

// ── PARSE HELPERS ─────────────────────────────────────────────────────────────
function parseFollowers(s){
  if(!s) return 0;
  s = s.trim();
  if(/^\d+,\d+K$/i.test(s)) return Math.round(parseFloat(s.replace(',','.').replace(/K/i,''))*1000);
  s = s.replace(/,/g,'');
  if(/\d+\.?\d*M$/i.test(s)) return Math.round(parseFloat(s)*1000000);
  if(/\d+\.?\d*K$/i.test(s)) return Math.round(parseFloat(s)*1000);
  return parseInt(s)||0;
}

function fmtN(n){
  if(!n) return '—';
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000)    return (n>=10000?Math.round(n/1000):(n/1000).toFixed(1))+'K';
  return String(n);
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function shortPrice(s){
  if(!s) return '—';
  const f = s.split('\n')[0].trim();
  return f.length>30 ? f.substring(0,30)+'…' : f||'—';
}

// ── LOAD DATA ─────────────────────────────────────────────────────────────────
function loadData(){
  Papa.parse(SHEET_URL, {
    download: true, header: true, skipEmptyLines: true,
    complete(res){
      if(!res.data.length){ showMsg('데이터가 없습니다'); return; }
      const keys = Object.keys(res.data[0]);
      ratecardKey = keys.find(k => k.toLowerCase().includes('ratecard'));

      allData = res.data.map(r => ({
        handle:      (r['Influencer ID [Please do not add @]']||'').trim(),
        url:         (r['URL']||'').trim(),
        followersRaw:(r['Followers']||'').trim(),
        followers:    parseFollowers(r['Followers']||''),
        status:      (r['Status']||'').trim(),
        ratecard:    ratecardKey ? (r[ratecardKey]||'').trim() : '',
        afterNego:   (r['AFTER NEGO']||'').trim(),
        contact:     (r['Contact']||'').trim(),
        contactDM:   (r['Contact DM TT']||'').trim(),
        outreach:    (r['Outreach Date']||'').trim(),
        agreement:   (r['Agreement Date']||'').trim(),
        selection:   (r['Selection']||'').trim(),
        postingTT:   (r['Posting URL (TT)']||'').trim(),
        postingIG:   (r['Posting URL (IG)']||'').trim(),
        views:       (r['Views']||'').trim(),
        likes:       (r['Likes♥']||r['Likes']||'').trim(),
        comments:    (r['Comments']||'').trim(),
        saves:       (r['Saves']||'').trim(),
      })).filter(r => r.handle);

      applyFilter();
      updateStats();
    },
    error(err){ showMsg('로드 실패: '+err.message); }
  });
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function updateStats(){
  const d = allData;
  const set = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };
  set('st-all',   d.length.toLocaleString());
  set('st-agree', d.filter(r=>r.status==='Agree').length);
  set('st-nego',  d.filter(r=>r.status==='Nego').length);
  set('st-app',   d.filter(r=>r.status.startsWith('Approach')).length);
  set('st-fup',   d.filter(r=>r.status==='Follow up').length);
  set('st-rej',   d.filter(r=>['Reject','Non USA','Wrong Email'].includes(r.status)).length);
}

// ── FILTER / SORT ─────────────────────────────────────────────────────────────
function applyFilter(){
  let d = [...allData];
  switch(activeFilter){
    case 'agree': d=d.filter(r=>r.status==='Agree'); break;
    case 'nego':  d=d.filter(r=>r.status==='Nego'); break;
    case 'fup':   d=d.filter(r=>r.status==='Follow up'); break;
    case 'app':   d=d.filter(r=>r.status.startsWith('Approach')); break;
    case 'reply': d=d.filter(r=>r.status==='Reply'); break;
    case 'rc':    d=d.filter(r=>r.status==='Give Ratecard'); break;
    case 'rej':   d=d.filter(r=>['Reject','Non USA','Wrong Email'].includes(r.status)); break;
  }
  if(searchQ){
    const q=searchQ.toLowerCase();
    d=d.filter(r=>r.handle.toLowerCase().includes(q)||r.contact.toLowerCase().includes(q));
  }
  if(sortCol){
    d.sort((a,b)=>{
      const av=sortCol==='followers'?a.followers:(a[sortCol]||'').toLowerCase();
      const bv=sortCol==='followers'?b.followers:(b[sortCol]||'').toLowerCase();
      if(typeof av==='number') return (bv-av)*sortDir;
      return av<bv?-sortDir:av>bv?sortDir:0;
    });
  }
  filteredData=d; page=0;
  renderTable(); renderPag();

  const lbl = document.getElementById('result-lbl');
  if(lbl) lbl.textContent = filteredData.length.toLocaleString()+'건';

  document.querySelectorAll('thead th').forEach(th=>th.classList.remove('sort-asc','sort-desc'));
  if(sortCol){
    const ci={handle:1,followers:2,status:3}[sortCol];
    if(ci!=null){
      const th=document.querySelectorAll('thead th')[ci];
      if(th) th.classList.add(sortDir===1?'sort-asc':'sort-desc');
    }
  }
}

// ── RENDER TABLE ──────────────────────────────────────────────────────────────
function renderTable(){
  const start = page*PAGE_SIZE;
  const rows  = filteredData.slice(start, start+PAGE_SIZE);
  const tbody = document.getElementById('tbody');

  if(!rows.length){
    tbody.innerHTML=`<tr><td colspan="6"><div class="center-msg"><div>결과가 없습니다</div></div></td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map((r,i)=>{
    const sc   = getSC(r.status);
    const isel = (start+i)===selectedIdx;
    const [fg,bg] = avColor(r.handle);
    const init = avInit(r.handle);
    return `<tr class="${isel?'row-sel':''}" onclick="selectRow(${start+i})">
      <td>${start+i+1}</td>
      <td>
        <div class="av-cell">
          <div class="av" style="background:${bg};color:${fg}">
            ${init}<img src="${THUMB_BASE}${encodeURIComponent(r.handle)}" alt="" loading="lazy" onerror="this.style.display='none'">
          </div>
          <div class="av-info">
            <div class="handle">
              @${esc(r.handle)}
              ${r.url?`<a href="${esc(r.url)}" target="_blank" onclick="event.stopPropagation()">↗</a>`:''}
            </div>
            <div class="contact-sub">${esc(r.contact)||'—'}</div>
          </div>
        </div>
      </td>
      <td>${esc(r.followersRaw)||fmtN(r.followers)||'—'}</td>
      <td><span class="sbadge" style="color:${sc.c};background:${sc.bg}">${esc(sc.lbl)}</span></td>
      <td class="price-cell">${esc(shortPrice(r.ratecard))}</td>
      <td class="price-cell after">${esc(shortPrice(r.afterNego))}</td>
    </tr>`;
  }).join('');
}

// ── PAGINATION ────────────────────────────────────────────────────────────────
function renderPag(){
  const total=Math.ceil(filteredData.length/PAGE_SIZE);
  const el=document.getElementById('pag-row');
  if(total<=1){el.innerHTML='';return;}

  const start=page*PAGE_SIZE+1;
  const end=Math.min((page+1)*PAGE_SIZE,filteredData.length);
  const W=2;
  let pages='';
  let prevDot=false;
  for(let p=0;p<total;p++){
    const near = p===0||p===total-1||(p>=page-W&&p<=page+W);
    if(near){
      prevDot=false;
      pages+=`<button class="pag-num${p===page?' cur':''}" onclick="goPage(${p})">${p+1}</button>`;
    } else if(!prevDot){
      prevDot=true;
      pages+=`<span class="pag-ellipsis">…</span>`;
    }
  }

  el.innerHTML=`
    <button class="pag-btn" onclick="goPage(${page-1})" ${page===0?'disabled':''}>← 이전</button>
    <div class="pag-pages">${pages}</div>
    <button class="pag-btn" onclick="goPage(${page+1})" ${page>=total-1?'disabled':''}>다음 →</button>
    <span style="margin-left:auto;color:var(--text2);font-size:11px">${start}–${end} / ${filteredData.length.toLocaleString()}건</span>`;
}

function goPage(p){
  const total=Math.ceil(filteredData.length/PAGE_SIZE);
  if(p<0||p>=total) return;
  page=p; renderTable(); renderPag();
  document.getElementById('table-wrap').scrollTop=0;
}

// ── DETAIL PANEL ──────────────────────────────────────────────────────────────
function selectRow(idx){
  selectedIdx=idx;
  renderTable();
  const r=filteredData[idx]; if(!r) return;
  const sc=getSC(r.status);
  const [fg,bg]=avColor(r.handle);
  const init=avInit(r.handle);

  const avEl=document.getElementById('dp-av');
  avEl.style.background=bg; avEl.style.color=fg;
  avEl.innerHTML=`${init}<img src="${THUMB_BASE}${encodeURIComponent(r.handle)}" alt="" onerror="this.style.display='none'">`;

  document.getElementById('dp-handle').textContent='@'+r.handle;
  document.getElementById('dp-sub').innerHTML=`<span class="sbadge" style="color:${sc.c};background:${sc.bg}">${esc(sc.lbl)}</span>`;

  const hasMetrics = r.views||r.likes||r.comments||r.saves;

  document.getElementById('dp-body').innerHTML=`
    <div class="dp-grid">
      <div><div class="dg-label">팔로워</div><div class="dg-val">${esc(r.followersRaw)||fmtN(r.followers)||'—'}</div></div>
      <div><div class="dg-label">DM 컨택</div><div class="dg-val">${r.contactDM==='TRUE'?'✓ 완료':'—'}</div></div>
      <div><div class="dg-label">컨택 날짜</div><div class="dg-val">${esc(r.outreach)||'—'}</div></div>
      <div><div class="dg-label">동의 날짜</div><div class="dg-val">${esc(r.agreement)||'—'}</div></div>
    </div>

    ${r.contact?`<div class="dp-sec"><div class="dp-sec-label">이메일</div><div class="dp-sec-val">${esc(r.contact)}</div></div>`:''}

    ${r.ratecard?`
    <div class="dp-sec">
      <div class="dp-sec-label">단가 카드 (원본)</div>
      <div class="ratecard-box">${esc(r.ratecard)}</div>
    </div>`:''}

    ${r.afterNego?`
    <div class="dp-sec">
      <div class="dp-sec-label">협상 후 단가</div>
      <div class="after-price">${esc(r.afterNego).replace(/\n/g,'<br>')}</div>
    </div>`:''}

    ${r.url?`<div class="dp-sec"><div class="dp-sec-label">프로필</div><a class="dp-link" href="${esc(r.url)}" target="_blank">${esc(r.url)}</a></div>`:''}

    ${r.postingTT?`<div class="dp-sec"><div class="dp-sec-label">포스팅 URL (TikTok)</div><a class="dp-link" href="${esc(r.postingTT)}" target="_blank">${esc(r.postingTT)}</a></div>`:''}

    ${r.postingIG?`<div class="dp-sec"><div class="dp-sec-label">포스팅 URL (Instagram)</div><a class="dp-link" href="${esc(r.postingIG)}" target="_blank">${esc(r.postingIG)}</a></div>`:''}

    ${hasMetrics?`
    <div class="dp-sec">
      <div class="dp-sec-label">성과 지표</div>
      <div class="metrics">
        <div class="metric"><div class="metric-lbl">조회수</div><div class="metric-val">${esc(r.views)||'—'}</div></div>
        <div class="metric"><div class="metric-lbl">좋아요</div><div class="metric-val">${esc(r.likes)||'—'}</div></div>
        <div class="metric"><div class="metric-lbl">댓글</div><div class="metric-val">${esc(r.comments)||'—'}</div></div>
        <div class="metric"><div class="metric-lbl">저장</div><div class="metric-val">${esc(r.saves)||'—'}</div></div>
      </div>
    </div>`:''}`;

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('table-area').classList.add('panel-open');
}

function closeDetail(){
  selectedIdx=-1;
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('table-area').classList.remove('panel-open');
  renderTable();
}

// ── CONTROLS ──────────────────────────────────────────────────────────────────
function setFilter(f){
  activeFilter=f;
  ['all','agree','nego','app','fup','rej'].forEach(k=>{
    document.getElementById('sc-'+k)?.classList.toggle('active',k===f);
  });
  const chipMap={all:'all',agree:'agree',nego:'nego',app:'app',fup:'fup',rej:'rej'};
  if(chipMap[f]) setChip(chipMap[f]); else applyFilter();
}

function setChip(k){
  activeFilter=k;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('chip-'+k)?.classList.add('active');
  const statMap={all:'all',agree:'agree',nego:'nego',app:'app',fup:'fup',rej:'rej'};
  ['all','agree','nego','app','fup','rej'].forEach(s=>{
    document.getElementById('sc-'+s)?.classList.toggle('active',statMap[k]===s);
  });
  closeDetail(); applyFilter();
}

function setSearch(q){ searchQ=q; page=0; applyFilter(); }

function setSort(col){
  if(sortCol===col) sortDir*=-1; else{sortCol=col;sortDir=1;}
  applyFilter();
}

function showMsg(msg){
  document.getElementById('tbody').innerHTML=`<tr><td colspan="6"><div class="center-msg"><div>${esc(msg)}</div></div></td></tr>`;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadData();
</script>

</html>
