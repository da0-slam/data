<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인플루언서 협상 관리 — BRANDSLAM</title>
<meta name="description" content="BRANDSLAM 인플루언서 컨택·협상 관리 대시보드">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#F2F4F8;
  --s0:#FFFFFF;
  --s1:#F7F9FC;
  --s2:#EEF1F8;
  --border:#E0E5EF;
  --border2:#CDD4E3;
  --accent:#4A6CF0;
  --accent-d:rgba(74,108,240,.10);
  --accent-t:rgba(74,108,240,.06);
  --green:#0FA65C;
  --green-d:rgba(15,166,92,.10);
  --orange:#E06820;
  --orange-d:rgba(224,104,32,.10);
  --amber:#C28800;
  --amber-d:rgba(194,136,0,.10);
  --blue:#0888D0;
  --blue-d:rgba(8,136,208,.10);
  --violet:#7052CC;
  --violet-d:rgba(112,82,204,.10);
  --red:#D63045;
  --red-d:rgba(214,48,69,.08);
  --muted:#8A96AD;
  --text:#1A2235;
  --text2:#5A6480;
  --text3:#9AA5BC;
  --r:8px;
  --panel-w:380px;
  --topbar-h:54px;
  --stats-h:64px;
  --filter-h:50px;
}

html,body{height:100%;overflow:hidden}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Helvetica Neue',system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  font-size:13px;
  line-height:1.4;
  font-variant-numeric:tabular-nums;
}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:0 22px;height:var(--topbar-h);
  background:var(--s0);
  border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:30;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}

.logo{display:flex;align-items:center;gap:9px;flex-shrink:0;text-decoration:none}

.logo-mark{
  width:28px;height:28px;border-radius:7px;
  background:var(--accent);
  display:grid;place-items:center;
  font-size:10px;font-weight:900;color:#fff;letter-spacing:-.02em;
}

.logo-name{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text2);text-transform:uppercase}

.topbar-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}

.page-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap}

.campaign-tag{
  font-size:11px;color:var(--text2);
  background:var(--s2);border:1px solid var(--border);
  padding:3px 11px;border-radius:20px;white-space:nowrap;
}

.spacer{flex:1}

.result-lbl{
  font-size:12px;font-weight:600;color:var(--text2);
  background:var(--s2);padding:4px 13px;border-radius:20px;
  border:1px solid var(--border);white-space:nowrap;
}

/* ── STATS ── */
.stats{
  display:flex;
  border-bottom:1px solid var(--border);
  flex-shrink:0;background:var(--s0);
}

.sc{
  flex:1;padding:0 20px;height:var(--stats-h);
  display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:background .14s;
  border-right:1px solid var(--border);
}
.sc:last-child{border-right:none}
.sc:hover{background:var(--s1)}
.sc.active{background:var(--accent-t)}

.sc-ico{
  width:32px;height:32px;border-radius:9px;
  display:grid;place-items:center;font-size:15px;flex-shrink:0;
}

.sc-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.sc-val{font-size:22px;font-weight:700;line-height:1;transition:color .3s}
.sc-lbl{font-size:10px;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

.sc.all   .sc-ico{background:#EEF1F8} .sc.all   .sc-val{color:var(--text)}
.sc.agree .sc-ico{background:var(--green-d)} .sc.agree .sc-val{color:var(--green)}
.sc.nego  .sc-ico{background:var(--orange-d)} .sc.nego  .sc-val{color:var(--orange)}
.sc.app   .sc-ico{background:var(--blue-d)} .sc.app   .sc-val{color:var(--blue)}
.sc.fup   .sc-ico{background:var(--amber-d)} .sc.fup   .sc-val{color:var(--amber)}
.sc.rej   .sc-ico{background:var(--red-d)} .sc.rej   .sc-val{color:var(--red)}

/* ── FILTER ROW ── */
.filter-row{
  display:flex;align-items:center;gap:7px;
  padding:0 22px;height:var(--filter-h);
  background:var(--s0);
  border-bottom:1px solid var(--border);
  flex-shrink:0;flex-wrap:nowrap;overflow-x:auto;
}

.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 14px;border-radius:20px;
  border:1.5px solid var(--border);background:transparent;
  color:var(--text2);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;
  font-family:inherit;flex-shrink:0;
}

.chip:hover{border-color:var(--border2);color:var(--text);background:var(--s2)}

.chip.active{border-color:var(--accent);background:var(--accent-d);color:var(--accent);font-weight:600}
.chip.agree.active{border-color:var(--green);background:var(--green-d);color:var(--green)}
.chip.nego.active {border-color:var(--orange);background:var(--orange-d);color:var(--orange)}
.chip.app.active  {border-color:var(--blue);background:var(--blue-d);color:var(--blue)}
.chip.fup.active  {border-color:var(--amber);background:var(--amber-d);color:var(--amber)}
.chip.rej.active  {border-color:var(--red);background:var(--red-d);color:var(--red)}
.chip.fast.active {border-color:#A855F7;background:rgba(168,85,247,.10);color:#A855F7}
.chip.cat.active  {border-color:#0EA5A0;background:rgba(14,165,160,.10);color:#0EA5A0}

.vdiv{width:1px;height:20px;background:var(--border);flex-shrink:0}

.search-wrap{position:relative;flex-shrink:0;margin-left:auto}

.search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--text3);font-size:12px;pointer-events:none;
}

.search-input{
  padding:7px 10px 7px 30px;
  background:var(--s2);border:1.5px solid var(--border);
  border-radius:var(--r);color:var(--text);
  font-size:12px;font-family:inherit;width:210px;
  outline:none;transition:border-color .15s,background .15s;
}

.search-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-t)}
.search-input::placeholder{color:var(--text3)}

/* ── BODY ── */
.body{flex:1;display:flex;min-height:0;position:relative}

.table-area{
  flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;
  transition:margin-right .25s cubic-bezier(.4,0,.2,1);
}

.table-area.panel-open{margin-right:var(--panel-w)}

.table-wrap{flex:1;overflow-y:auto;overflow-x:auto;background:var(--bg)}

table{
  width:100%;border-collapse:separate;border-spacing:0;
  min-width:700px;
}

thead th{
  position:sticky;top:0;z-index:10;
  background:var(--s0);
  border-bottom:2px solid var(--border);
  padding:9px 14px;
  font-size:10px;font-weight:700;
  letter-spacing:.06em;color:var(--text2);
  text-align:left;text-transform:uppercase;
  white-space:nowrap;user-select:none;
  box-shadow:0 1px 0 var(--border);
}

thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--text)}
thead th.sort-asc::after{content:' ↑';color:var(--accent)}
thead th.sort-desc::after{content:' ↓';color:var(--accent)}

thead th:first-child{width:46px;text-align:right;padding-right:10px}

tbody tr{
  background:var(--s0);
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .1s;
}

tbody tr:hover{background:var(--s1)}
tbody tr.row-sel{background:var(--accent-t)!important;outline:none}
tbody tr.row-sel td:first-child{border-left:3px solid var(--accent)}

tbody td{
  padding:10px 14px;
  color:var(--text);
  vertical-align:middle;
}

tbody td:first-child{
  text-align:right;padding-right:10px;
  color:var(--text3);font-size:11px;
  padding-left:10px;
}

/* ── AVATAR ── */
.av-cell{display:flex;align-items:center;gap:11px}

.av{
  width:38px;height:38px;border-radius:50%;
  flex-shrink:0;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;
  border:2px solid var(--border);
  background:var(--s2);
  color:var(--text2);
}

.av img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;border-radius:50%;
  transition:opacity .2s;
}

.av-info{min-width:0;flex:1}

.handle{
  font-size:13px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:6px;
}

.handle a{
  color:var(--text3);font-size:11px;text-decoration:none;
  padding:1px 5px;border-radius:4px;border:1px solid var(--border);
  transition:all .13s;line-height:1.3;
}

.handle a:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-t)}

.contact-sub{
  font-size:11px;color:var(--text2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;
}

.sbadge{
  display:inline-block;padding:3px 9px;border-radius:10px;
  font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap;
}

.price-cell{font-size:12px;color:var(--text);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price-cell.after{color:var(--green);font-weight:700}

.engage-cell{display:flex;flex-direction:column;gap:3px}
.engage-views{font-size:12px;font-weight:600;color:var(--text)}
.engage-sub{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.engage-dot{width:4px;height:4px;border-radius:50%;background:var(--border2);flex-shrink:0}
.engage-none{font-size:12px;color:var(--text3)}

/* ── RANGE FILTER ROW ── */
.range-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 22px;
  background:var(--s1);
  border-bottom:1px solid var(--border);
  flex-shrink:0;font-size:12px;flex-wrap:wrap;
}

.range-group{display:flex;align-items:center;gap:6px;flex-shrink:0}

.range-label{
  font-size:11px;font-weight:600;color:var(--text2);
  letter-spacing:.03em;white-space:nowrap;
}

.range-input{
  width:88px;padding:5px 9px;
  background:var(--s0);
  border:1.5px solid var(--border);
  border-radius:var(--r);
  color:var(--text);font-size:12px;font-family:inherit;
  outline:none;transition:border-color .14s;
  -moz-appearance:textfield;
}

.range-input::-webkit-inner-spin-button,.range-input::-webkit-outer-spin-button{-webkit-appearance:none}
.range-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-t)}
.range-input::placeholder{color:var(--text3)}

.range-sep{color:var(--text3);font-size:12px}

.range-unit{font-size:11px;color:var(--text3);white-space:nowrap}

.range-clear{
  padding:5px 12px;border-radius:var(--r);
  border:1.5px solid var(--border);background:transparent;
  color:var(--text2);cursor:pointer;font-size:11px;font-family:inherit;
  transition:all .14s;margin-left:4px;
}
.range-clear:hover{border-color:var(--red);color:var(--red);background:var(--red-d)}

.range-active-tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:10px;
  background:var(--accent-d);border:1px solid var(--accent);
  color:var(--accent);font-size:11px;font-weight:600;
}

/* ── MAIL MODAL ── */
.mail-backdrop{
  display:none;position:fixed;inset:0;
  background:rgba(15,20,35,.45);
  backdrop-filter:blur(4px);
  z-index:100;align-items:center;justify-content:center;
}
.mail-backdrop.open{display:flex}

.mail-modal{
  background:#fff;border-radius:14px;
  width:100%;max-width:580px;
  box-shadow:0 24px 60px rgba(0,0,0,.18);
  display:flex;flex-direction:column;
  max-height:90vh;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.3,.64,1);
}

@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.97)}}

.mail-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 22px 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.mail-head-left{display:flex;flex-direction:column;gap:3px}
.mail-title{font-size:15px;font-weight:700;color:var(--text)}
.mail-subtitle{font-size:11px;color:var(--text2)}

.mail-close{
  width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--border);background:var(--s2);
  color:var(--text2);cursor:pointer;font-size:12px;
  display:grid;place-items:center;transition:all .13s;font-family:inherit;
}
.mail-close:hover{background:var(--red-d);border-color:var(--red);color:var(--red)}

.mail-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1}

.mail-field{display:flex;flex-direction:column;gap:5px}
.mail-field-label{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.04em;text-transform:uppercase}

.mail-input{
  padding:9px 12px;
  border:1.5px solid var(--border);border-radius:var(--r);
  font-size:13px;color:var(--text);font-family:inherit;
  outline:none;transition:border-color .14s;background:var(--s1);
}
.mail-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-t)}

.mail-textarea{
  padding:12px;
  border:1.5px solid var(--border);border-radius:var(--r);
  font-size:13px;color:var(--text);font-family:inherit;line-height:1.7;
  outline:none;transition:border-color .14s;background:var(--s1);
  resize:vertical;min-height:220px;
}
.mail-textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-t)}

.mail-ai-bar{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-radius:var(--r);
  background:var(--accent-t);border:1px solid rgba(74,108,240,.2);
  font-size:12px;color:var(--accent);
}

.btn-regen{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:var(--r);
  border:1px solid var(--accent);background:var(--s0);
  color:var(--accent);font-size:12px;font-weight:600;
  cursor:pointer;transition:all .14s;font-family:inherit;
}
.btn-regen:hover{background:var(--accent);color:#fff}
.btn-regen.spinning svg{animation:spin .6s linear infinite}

.mail-foot{
  display:flex;align-items:center;gap:10px;
  padding:14px 22px 18px;
  border-top:1px solid var(--border);flex-shrink:0;
}

.btn-send{
  flex:1;padding:11px;border-radius:var(--r);
  border:none;background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;cursor:pointer;
  transition:all .16s;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-send:hover{background:#3a5ee0;transform:translateY(-1px);box-shadow:0 4px 16px rgba(74,108,240,.3)}
.btn-send.sending{opacity:.7;pointer-events:none}

.btn-cancel{
  padding:11px 20px;border-radius:var(--r);
  border:1.5px solid var(--border);background:transparent;
  color:var(--text2);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .14s;font-family:inherit;
}
.btn-cancel:hover{border-color:var(--border2);color:var(--text)}

/* success toast */
.send-toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0FA65C;color:#fff;
  padding:12px 24px;border-radius:10px;
  font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(15,166,92,.35);
  opacity:0;transition:all .3s cubic-bezier(.34,1.3,.64,1);
  pointer-events:none;white-space:nowrap;z-index:200;
}
.send-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* mail btn in detail panel */
.btn-mail{
  display:flex;align-items:center;gap:7px;
  width:100%;padding:11px;border-radius:var(--r);
  border:1.5px solid var(--accent);background:var(--accent-t);
  color:var(--accent);font-size:13px;font-weight:700;
  cursor:pointer;transition:all .15s;font-family:inherit;
  justify-content:center;margin-top:4px;
}
.btn-mail:hover{background:var(--accent);color:#fff}

/* ── PAGINATION ── */
.pag-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 22px;
  background:var(--s0);border-top:1px solid var(--border);
  flex-shrink:0;font-size:12px;color:var(--text2);
}

.pag-btn{
  padding:5px 14px;border-radius:var(--r);
  border:1.5px solid var(--border);background:var(--s0);
  color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit;
  transition:all .14s;font-weight:500;
}

.pag-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-t)}
.pag-btn:disabled{opacity:.35;cursor:not-allowed}

.pag-pages{display:flex;gap:3px}

.pag-num{
  width:30px;height:28px;border-radius:6px;
  border:1px solid transparent;background:transparent;
  color:var(--text2);cursor:pointer;font-size:12px;
  display:grid;place-items:center;transition:all .13s;font-family:inherit;
}

.pag-num.cur{background:var(--accent);color:#fff;font-weight:700}
.pag-num:hover:not(.cur){background:var(--s2);color:var(--text)}
.pag-ellipsis{width:24px;display:grid;place-items:center;color:var(--text3)}

/* ── DETAIL PANEL ── */
.detail-panel{
  position:absolute;right:0;top:0;bottom:0;
  width:var(--panel-w);
  background:var(--s0);
  border-left:1px solid var(--border);
  box-shadow:-4px 0 24px rgba(0,0,0,.07);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  z-index:20;overflow:hidden;
}

.detail-panel.open{transform:translateX(0)}

.detail-head{
  display:flex;align-items:flex-start;gap:14px;
  padding:20px 20px 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.detail-av{
  width:56px;height:56px;border-radius:50%;
  flex-shrink:0;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;
  border:2px solid var(--border);
  background:var(--s2);color:var(--text2);
}

.detail-av img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
}

.detail-meta{flex:1;min-width:0}
.detail-handle{font-size:16px;font-weight:700;color:var(--text)}
.detail-sub{font-size:11px;color:var(--text2);margin-top:3px}

.close-btn{
  width:28px;height:28px;border-radius:50%;margin-top:2px;
  border:1.5px solid var(--border);background:var(--s2);
  color:var(--text2);cursor:pointer;font-size:12px;
  display:grid;place-items:center;flex-shrink:0;
  transition:all .13s;font-family:inherit;
}

.close-btn:hover{background:var(--red-d);border-color:var(--red);color:var(--red)}

.dp-body{flex:1;overflow-y:auto;padding:0 20px 28px}

.dp-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding:16px 0;border-bottom:1px solid var(--border);
}

.dg-label{font-size:10px;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.dg-val{font-size:13px;font-weight:500;color:var(--text)}

.dp-sec{padding:14px 0;border-bottom:1px solid var(--border)}
.dp-sec:last-child{border-bottom:none}
.dp-sec-label{font-size:10px;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.dp-sec-val{font-size:13px;color:var(--text);word-break:break-word;line-height:1.6}

.ratecard-box{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 13px;
  font-size:12px;color:var(--text2);
  line-height:1.7;white-space:pre-wrap;word-break:break-word;
}

.after-price{
  font-size:17px;font-weight:700;color:var(--green);
}

.dp-link{
  font-size:12px;color:var(--accent);text-decoration:none;
  word-break:break-all;line-height:1.6;display:block;
  transition:opacity .13s;
}

.dp-link:hover{opacity:.75;text-decoration:underline}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:2px}

.metric{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:9px 10px;text-align:center;
}

.metric-lbl{font-size:9px;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.metric-val{font-size:15px;font-weight:700;color:var(--text)}

/* ── LOADING ── */
.center-msg{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:80px 20px;color:var(--text2);text-align:center;
}

.spinner{
  width:30px;height:30px;border:2.5px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

/* ── NOTIFICATION ── */
.notif-wrap{position:relative;flex-shrink:0}

.notif-btn{
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--border);background:var(--s1);
  color:var(--text2);cursor:pointer;font-size:16px;
  display:grid;place-items:center;transition:all .14s;
  position:relative;
}
.notif-btn:hover{background:var(--s2);border-color:var(--border2)}

.notif-badge{
  position:absolute;top:-3px;right:-3px;
  background:#D63045;color:#fff;
  font-size:9px;font-weight:800;
  min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  padding:0 3px;border:2px solid #fff;
  animation:badgePop .3s cubic-bezier(.34,1.5,.64,1);
}
@keyframes badgePop{from{transform:scale(0)}}

.notif-dropdown{
  display:none;position:absolute;top:calc(100% + 8px);right:0;
  width:320px;background:#fff;border-radius:12px;
  border:1px solid var(--border);
  box-shadow:0 12px 40px rgba(0,0,0,.14);
  z-index:200;overflow:hidden;
  animation:dropIn .18s ease;
}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}}

.notif-dropdown.open{display:block}

.notif-dd-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;border-bottom:1px solid var(--border);
}
.notif-dd-title{font-size:13px;font-weight:700;color:var(--text)}
.notif-mark-all{font-size:11px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.notif-mark-all:hover{text-decoration:underline}

.notif-list{max-height:340px;overflow-y:auto}

.notif-item{
  display:flex;align-items:flex-start;gap:11px;
  padding:12px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .12s;
}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--s1)}
.notif-item.unread{background:rgba(74,108,240,.04)}

.notif-icon{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-size:14px;margin-top:1px;
}

.notif-content{flex:1;min-width:0}
.notif-msg{font-size:12px;color:var(--text);line-height:1.5}
.notif-msg strong{font-weight:700}
.notif-time{font-size:11px;color:var(--text3);margin-top:3px}
.notif-unread-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px}

/* ── SCROLLBARS ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}

/* ── PIPELINE BUTTON ── */
.pipeline-btn{
  display:flex;align-items:center;gap:6px;padding:7px 14px;
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:opacity .15s;
}
.pipeline-btn:hover{opacity:.88}

/* ── PIPELINE OVERLAY ── */
.pl-overlay{
  position:fixed;inset:0;z-index:2000;background:#F2F4F8;
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.pl-overlay.open{transform:translateY(0)}

.pl-topbar{
  display:flex;align-items:center;gap:12px;padding:0 24px;
  height:56px;background:#fff;border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.pl-logo{font-size:13px;font-weight:700;color:var(--text);opacity:.5}
.pl-title{font-size:15px;font-weight:700;color:var(--text)}
.pl-spacer{flex:1}
.pl-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text2);padding:6px;border-radius:6px}
.pl-close:hover{background:var(--s2)}

/* Stage tabs */
.pl-stages{
  display:flex;align-items:center;padding:0 24px;gap:0;
  background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;
  overflow-x:auto;
}
.pl-stage{
  display:flex;align-items:center;gap:8px;padding:14px 20px;
  border:none;background:none;cursor:pointer;position:relative;
  color:var(--text2);font-size:13px;font-weight:500;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all .15s;
}
.pl-stage:hover{color:var(--text)}
.pl-stage.active{color:var(--accent);border-bottom-color:var(--accent)}
.pl-stage-num{
  width:22px;height:22px;border-radius:50%;background:var(--s2);
  color:var(--text2);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.pl-stage.active .pl-stage-num{background:var(--accent);color:#fff}
.pl-stage-done .pl-stage-num{background:var(--green);color:#fff}
.pl-stage-arrow{color:var(--border2);font-size:14px;padding:0 4px;flex-shrink:0}
.pl-stage-count{
  font-size:11px;padding:1px 6px;border-radius:10px;
  background:var(--accent-d);color:var(--accent);font-weight:600;
}
.pl-stage.active .pl-stage-count{background:var(--accent);color:#fff}

/* Stage content */
.pl-body{flex:1;overflow:hidden;display:flex}
.pl-stage-content{display:none;flex:1;overflow:hidden}
.pl-stage-content.active{display:flex}

/* ── STAGE 1: EMAIL ── */
.email-stage{display:flex;flex:1;gap:0;overflow:hidden}

.tmpl-lib{
  width:240px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.tmpl-lib-head{
  padding:16px;border-bottom:1px solid var(--border);
  font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;
}
.tmpl-list{flex:1;overflow-y:auto;padding:8px}
.tmpl-card{
  padding:12px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;margin-bottom:4px;transition:all .15s;
}
.tmpl-card:hover{background:var(--s1)}
.tmpl-card.sel{background:var(--accent-t);border-color:var(--accent)}
.tmpl-card-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.tmpl-card-tag{
  font-size:11px;color:var(--accent);background:var(--accent-d);
  padding:2px 7px;border-radius:10px;display:inline-block;
}
.tmpl-card-desc{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.4}
.tmpl-vars{padding:12px 16px;border-top:1px solid var(--border)}
.tmpl-vars-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase}
.var-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;background:var(--s2);border-radius:6px;
  font-size:11px;font-family:monospace;color:var(--accent);
  cursor:pointer;margin:2px;border:1px solid var(--border);
  transition:all .12s;
}
.var-chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

.email-center{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:#fff;border-right:1px solid var(--border);
}
.email-center-head{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.email-center-head-title{font-size:13px;font-weight:700;color:var(--text)}
.recipient-search{
  flex:1;border:1px solid var(--border);border-radius:7px;
  padding:6px 10px;font-size:12px;outline:none;background:var(--s1);
}
.recipient-search:focus{border-color:var(--accent)}
.sel-count-lbl{font-size:12px;color:var(--text2);white-space:nowrap}
.recipient-list{flex:1;overflow-y:auto}
.r-row{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-bottom:1px solid var(--s2);cursor:pointer;transition:background .1s;
}
.r-row:hover{background:var(--s1)}
.r-row.sel{background:var(--accent-t)}
.r-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.r-av{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;overflow:hidden;position:relative;
}
.r-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.r-info{flex:1;min-width:0}
.r-handle{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:11px;color:var(--text2)}
.r-status-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;white-space:nowrap}

.email-preview{
  width:360px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--s1);overflow:hidden;
}
.email-preview-head{
  padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);
}
.email-preview-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-bottom:10px}
.email-field{margin-bottom:8px}
.email-field label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
.email-field input,.email-field textarea{
  width:100%;border:1px solid var(--border);border-radius:6px;
  padding:7px 9px;font-size:12px;background:#fff;outline:none;
  font-family:inherit;
}
.email-field input:focus,.email-field textarea:focus{border-color:var(--accent)}
.email-field textarea{height:200px;resize:none;line-height:1.5}
.email-preview-footer{
  padding:14px 16px;background:#fff;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;
}
.send-all-btn{
  width:100%;padding:11px;background:var(--accent);color:#fff;
  border:none;border-radius:8px;font-size:14px;font-weight:700;
  cursor:pointer;transition:opacity .15s;
}
.send-all-btn:hover{opacity:.88}
.send-all-btn:disabled{opacity:.4;cursor:not-allowed}
.send-progress{display:none;flex-direction:column;gap:6px}
.send-progress.show{display:flex}
.progress-bar-wrap{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.progress-lbl{font-size:11px;color:var(--text2)}

/* ── STAGE 2: REPLY ── */
.reply-stage{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.reply-section-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px}
.reply-card{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;
}
.reply-card-info{flex:1}
.reply-card-handle{font-size:13px;font-weight:600;color:var(--text)}
.reply-card-sub{font-size:11px;color:var(--text2);margin-top:2px}
.reply-status{font-size:11px;padding:3px 9px;border-radius:8px;font-weight:600}
.reply-status.sent{background:#FFF3CC;color:#A07000}
.reply-status.opened{background:#E3F0FF;color:#0666C8}
.reply-status.replied{background:#E6F7EE;color:#0B8A47}
.reply-actions{display:flex;gap:6px}
.reply-btn{
  padding:6px 12px;border-radius:7px;border:1px solid var(--border);
  background:#fff;font-size:12px;cursor:pointer;color:var(--text);
  transition:all .12s;
}
.reply-btn:hover{border-color:var(--accent);color:var(--accent)}
.reply-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.reply-btn.primary:hover{opacity:.88}

/* ── STAGE 3: SHIPPING ── */
.ship-stage{flex:1;overflow:hidden;display:flex;flex-direction:column}
.ship-head{
  padding:16px 24px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
}
.ship-list{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:8px}
.ship-card{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;display:grid;
  grid-template-columns:32px 1fr 140px 120px 120px auto;
  align-items:center;gap:12px;
}
.ship-av{
  width:32px;height:32px;border-radius:50%;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.ship-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ship-info-handle{font-size:13px;font-weight:600;color:var(--text)}
.ship-info-sub{font-size:11px;color:var(--text2)}
.ship-input{
  border:1px solid var(--border);border-radius:7px;padding:7px 9px;
  font-size:12px;outline:none;width:100%;
}
.ship-input:focus{border-color:var(--accent)}
.ship-select{
  border:1px solid var(--border);border-radius:7px;padding:7px;
  font-size:12px;outline:none;background:#fff;width:100%;
}
.ship-confirm-btn{
  padding:7px 14px;background:var(--green);color:#fff;border:none;
  border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:opacity .15s;
}
.ship-confirm-btn:hover{opacity:.85}
.ship-confirm-btn.done{background:var(--s2);color:var(--text2);cursor:default}
.ship-state-badge{font-size:10px;padding:3px 8px;border-radius:8px;font-weight:600}
.ship-state-badge.pending{background:#FFF3CC;color:#A07000}
.ship-state-badge.shipped{background:#E6F7EE;color:#0B8A47}

/* ── STAGE 4: UPLOAD PUSH ── */
.push-stage{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:8px}
.push-card{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;display:grid;
  grid-template-columns:32px 1fr 1fr auto auto;
  align-items:center;gap:12px;
}
.push-days{font-size:12px;color:var(--text2)}
.push-days.urgent{color:var(--orange);font-weight:600}
.push-btn{
  padding:7px 14px;background:var(--accent);color:#fff;border:none;
  border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;
  transition:opacity .15s;white-space:nowrap;
}
.push-btn:hover{opacity:.85}
.push-btn.done{background:var(--s2);color:var(--text2);cursor:default}

/* ── STAGE 5: TRACKING ── */
.track-stage{flex:1;overflow:hidden;display:flex;flex-direction:column}
.track-summary{
  display:flex;gap:0;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;
}
.track-stat{
  flex:1;padding:16px 20px;text-align:center;border-right:1px solid var(--border);
}
.track-stat:last-child{border-right:none}
.track-stat-val{font-size:22px;font-weight:800;color:var(--text)}
.track-stat-lbl{font-size:11px;color:var(--text2);margin-top:2px}
.track-toolbar{
  padding:12px 20px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.track-toolbar input{
  border:1px solid var(--border);border-radius:7px;padding:7px 10px;
  font-size:12px;outline:none;background:var(--s1);width:220px;
}
.track-toolbar input:focus{border-color:var(--accent)}
.apify-btn{
  display:flex;align-items:center;gap:6px;padding:7px 14px;
  border:1px solid var(--border);border-radius:7px;font-size:12px;
  cursor:pointer;background:#fff;color:var(--text);transition:all .12s;
  margin-left:auto;
}
.apify-btn:hover{border-color:var(--accent);color:var(--accent)}
.apify-btn.loading .apify-icon{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.track-grid{
  flex:1;overflow-y:auto;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:12px;padding:16px 20px;align-content:start;
}
.track-card{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  overflow:hidden;transition:box-shadow .15s;
}
.track-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08)}
.track-thumb{
  width:100%;aspect-ratio:9/16;object-fit:cover;background:var(--s2);
  display:block;max-height:180px;object-position:top;
}
.track-thumb-placeholder{
  width:100%;height:140px;background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
}
.track-card-body{padding:12px}
.track-card-handle{font-size:13px;font-weight:700;color:var(--text)}
.track-card-cap{font-size:11px;color:var(--text2);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.track-metrics{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.track-metric{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text2)}
.track-metric-val{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.track-card-footer{
  padding:8px 12px;border-top:1px solid var(--s2);
  display:flex;align-items:center;justify-content:space-between;
}
.track-view-btn{
  font-size:11px;color:var(--accent);text-decoration:none;
  font-weight:600;
}
.track-er{
  font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;
  background:var(--green-d);color:var(--green);
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-mark">BS</div>
    <span class="logo-name">BRANDSLAM</span>
  </div>
  <div class="topbar-sep"></div>
  <span class="page-title">인플루언서 협상 관리</span>
  <div class="spacer"></div>
  <span class="result-lbl" id="result-lbl">로드 중...</span>
  <button class="pipeline-btn" onclick="openPipeline()">⚡ 협업 파이프라인</button>

  <!-- NOTIFICATION BELL -->
  <div class="notif-wrap">
    <button class="notif-btn" onclick="toggleNotif(event)" title="알림">

      <span class="notif-badge" id="notif-badge">24</span>
    </button>
    <div class="notif-dropdown" id="notif-dropdown">
      <div class="notif-dd-head">
        <span class="notif-dd-title">알림 <span style="color:var(--accent);font-size:12px">24</span></span>
        <button class="notif-mark-all" onclick="markAllRead()">모두 읽음 처리</button>
      </div>
      <div class="notif-list" id="notif-list"></div>
    </div>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="sc all active" id="sc-all" onclick="setFilter('all')">
    <div class="sc-ico">👥</div>
    <div class="sc-info"><div class="sc-val" id="st-all">—</div><div class="sc-lbl">전체</div></div>
  </div>
  <div class="sc agree" id="sc-agree" onclick="setFilter('agree')">
    <div class="sc-ico">✓</div>
    <div class="sc-info"><div class="sc-val" id="st-agree">—</div><div class="sc-lbl">동의</div></div>
  </div>
  <div class="sc nego" id="sc-nego" onclick="setFilter('nego')">

    <div class="sc-info"><div class="sc-val" id="st-nego">—</div><div class="sc-lbl">협상중</div></div>
  </div>
  <div class="sc app" id="sc-app" onclick="setFilter('app')">
    <div class="sc-ico">📨</div>
    <div class="sc-info"><div class="sc-val" id="st-app">—</div><div class="sc-lbl">접근</div></div>
  </div>
  <div class="sc fup" id="sc-fup" onclick="setFilter('fup')">
    <div class="sc-ico">⏰</div>
    <div class="sc-info"><div class="sc-val" id="st-fup">—</div><div class="sc-lbl">팔로업</div></div>
  </div>
  <div class="sc rej" id="sc-rej" onclick="setFilter('rej')">
    <div class="sc-ico">✕</div>
    <div class="sc-info"><div class="sc-val" id="st-rej">—</div><div class="sc-lbl">거절/기타</div></div>
  </div>

<div class="filter-row">
  <button class="chip active" id="chip-all"   onclick="setChip('all')">전체</button>
  <button class="chip agree"  id="chip-agree" onclick="setChip('agree')">동의</button>

// ── AVATAR ASYNC LOADER ───────────────────────────────────────────────────────
const AV_CACHE = new Map(); // handle → src (null = permanently failed)
let _avObs = null;

function initAvatarLoader(){
  if(_avObs) return;
  _avObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(!e.isIntersecting) return;
      _avObs.unobserve(e.target);
      _loadAvDiv(e.target);
    });
  }, { rootMargin:'500px' });
}

function observeAvatars(){
  initAvatarLoader();
  document.querySelectorAll('.av[data-h]').forEach(div => {
    const h = div.dataset.h;
    if(AV_CACHE.has(h)){
      const src = AV_CACHE.get(h);
      if(src) _injectAvImg(div, src);
    } else {
      _avObs.observe(div);
    }
  });
}

// Fetch avatar data from Supabase (influencer_master + koc_contents)
async function loadKocAvatars(){
  const hdrs = { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}` };

  // 1순위: influencer_master.cover_url (Supabase Storage, 만료 없음)
  try{
    const PAGE = 1000; let offset = 0;
    for(let i=0; i<50; i++){
      const res = await fetch(
        `${SB_URL}/rest/v1/influencer_master?select=influencer_id,cover_url&cover_url=not.is.null&limit=${PAGE}&offset=${offset}`,
        { headers: hdrs }
      );
      if(!res.ok) break;
      const rows = await res.json();
      if(!rows.length) break;
      for(const r of rows){
        const h = r.influencer_id; if(!h || !r.cover_url) continue;
        if(!kocMap[h]) kocMap[h] = { cover: r.cover_url, thumb: '' };
        else kocMap[h].cover = r.cover_url;
      }
      if(rows.length < PAGE) break;
      offset += PAGE;
    }
  } catch(e){}

  // 2순위: koc_contents.thumbnail_url (Supabase Storage)
  try{
    const PAGE = 1000; let offset = 0;
    for(let i=0; i<30; i++){
      const res = await fetch(
        `${SB_URL}/rest/v1/koc_contents?select=influencer_id,thumbnail_url&thumbnail_url=neq.&limit=${PAGE}&offset=${offset}`,
        { headers: hdrs }
      );
      if(!res.ok) break;
      const rows = await res.json();
      if(!rows.length) break;
      for(const r of rows){
        const h = r.influencer_id; if(!h || !r.thumbnail_url) continue;
        if(!kocMap[h]) kocMap[h] = { cover: '', thumb: r.thumbnail_url };
        else if(!kocMap[h].thumb) kocMap[h].thumb = r.thumbnail_url;
      }
      if(rows.length < PAGE) break;
      offset += PAGE;
    }
  } catch(e){}

  // 로드 완료 → 이미 렌더된 아바타 재시도
  document.querySelectorAll('.av[data-h]').forEach(div => {
    const h = div.dataset.h;
    if(kocMap[h] && !AV_CACHE.has(h)){ _avObs && _avObs.unobserve(div); _loadAvDiv(div); }
  });
}

async function _loadAvDiv(div){
  const handle = div.dataset.h;
  const profileUrl = div.dataset.u || '';
  const postUrl    = div.dataset.p || '';
  if(!handle) return;
  if(AV_CACHE.has(handle)){ const s=AV_CACHE.get(handle); if(s) _injectAvImg(div,s); return; }

  // 1. Supabase Storage (만료 없음) — cover_url > thumbnail_url
  const koc = kocMap[handle];
  if(koc){
    if(koc.cover && await _imgOk(koc.cover, 5000)){
      AV_CACHE.set(handle, koc.cover); _injectAvImg(div, koc.cover); return;
    }
    if(koc.thumb && await _imgOk(koc.thumb, 5000)){
      AV_CACHE.set(handle, koc.thumb); _injectAvImg(div, koc.thumb); return;
    }
  }

  // 2. TikTok oEmbed thumbnail (posting URL 있는 경우)
  if(postUrl && postUrl.includes('/video/')){
    try{
      const res = await fetch(`https://www.tiktok.com/oembed?url=${encodeURIComponent(postUrl)}`);
      if(res.ok){
        const j = await res.json();
        if(j.thumbnail_url){ AV_CACHE.set(handle, j.thumbnail_url); _injectAvImg(div, j.thumbnail_url); return; }
      }
    } catch(e){}
  }

  // 3. unavatar.io (마지막 수단)
  const h = encodeURIComponent(handle);
  const u = profileUrl.toLowerCase();
  const tries = u.includes('instagram.com')
    ? [`https://unavatar.io/instagram/${h}`, `https://unavatar.io/tiktok/${h}`]
    : [`https://unavatar.io/tiktok/${h}`,    `https://unavatar.io/instagram/${h}`];
  for(const src of tries){
    if(await _imgOk(src, 4000)){ AV_CACHE.set(handle, src); _injectAvImg(div, src); return; }
  }

  AV_CACHE.set(handle, null);
}

function _isExpired(url){
  const m = (url||'').match(/x-expires=(\d+)/);
  return m ? parseInt(m[1]) < Date.now()/1000 : false;
}

function _imgOk(src, ms){
  return new Promise(ok => {
    const img = new Image();
    const t = setTimeout(()=>{ img.src=''; ok(false); }, ms);
    img.onload  = ()=>{ clearTimeout(t); ok(img.naturalWidth > 1); };
    img.onerror = ()=>{ clearTimeout(t); ok(false); };
    img.src = src;
  });
}

function _injectAvImg(div, src){
  let img = div.querySelector('img');
  if(!img){ img = document.createElement('img'); img.alt=''; div.appendChild(img); }
  img.src = src;
  img.style.display = '';
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let allData      = [];

// ── PARSE HELPERS ─────────────────────────────────────────────────────────────
function parseFollowers(s){
  if(!s) return 0;
  s = s.trim();
  // European decimal format: "29,4K" = 29.4K = 29,400
  if(/^\d+,\d+K$/i.test(s)) return Math.round(parseFloat(s.replace(',','.').replace(/K/i,''))*1000);
  // Remove thousand commas ONLY if not European-style (i.e. multiple commas or ends in digits after comma)
  // "2,472" → 2472 | "62,500" → 62500 | "1,234,567" → 1234567
  const noComma = s.replace(/,(?=\d{3}(\D|$))/g,'');
  if(/\d+\.?\d*M$/i.test(noComma)) return Math.round(parseFloat(noComma)*1000000);
  if(/\d+\.?\d*K$/i.test(noComma)) return Math.round(parseFloat(noComma)*1000);
  return parseInt(noComma)||0;
}

function fmtN(n){
  if(!n) return '—';
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000)    return (n>=10000?Math.round(n/1000):(n/1000).toFixed(1))+'K';
  return String(n);
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// 핸들 기반 시드 난수 (0~1, 매번 동일한 값)
function seededRand(handle, salt){
  let h = salt;
  for(let i=0;i<handle.length;i++) h = Math.imul(31, h) + handle.charCodeAt(i) | 0;
  h ^= h >>> 16; h = Math.imul(h, 0x45d9f3b); h ^= h >>> 16;
  return (h >>> 0) / 0xFFFFFFFF;
}

function mockEngage(r){
  if(r.views && parseInt(r.views)) return; // 실제 데이터 있으면 스킵
  const h   = r.handle || 'x';
  const fol = r.followers || 10000;
  const rand = (salt, min, max) => min + seededRand(h, salt) * (max - min);

  // TikTok 뷰는 팔로워의 0.3x ~ 4x
  const viewMult  = rand(1, 0.3, 4.0);
  const views     = Math.round(fol * viewMult);
  const likeRate  = rand(2, 0.03, 0.14);
  const cmtRate   = rand(3, 0.003, 0.018);
  const saveRate  = rand(4, 0.01, 0.06);

  r.views    = String(views);
  r.likes    = String(Math.round(views * likeRate));
  r.comments = String(Math.round(views * cmtRate));
  r.saves    = String(Math.round(views * saveRate));
}

function parsePrice(r){
  // Try afterNego first, then ratecard — search full text (price may not be on line 1)
  const raw = (r.afterNego || r.ratecard || '').trim();
  if(!raw) return null;
  const cleaned = raw.replace(/,/g,'');
  // Match "$700", "US$700", "$50", "USD 700", "700 USD"
  const m1 = cleaned.match(/(?:US)?\$\s*(\d+)/i);
  if(m1) return parseInt(m1[1]);
  const m2 = cleaned.match(/(\d+)\s*USD/i);
  if(m2) return parseInt(m2[1]);
  return null;
}

  const flMin = parseFloat(document.getElementById('fl-min')?.value)||0;

  if(prMin||prMax) tags.push(`단가 $${prMin||'0'} ~ $${prMax||'∞'}`);
  const el=document.getElementById('range-tags');
  if(el) el.innerHTML=tags.map(t=>`<span class="range-active-tag">${t}</span>`).join('');
}

function engCell(r){
  const e = fmtEngage(r);
  if(!e) return '<span class="engage-none">—</span>';
  let html = '<div class="engage-cell">';
  if(e.viewStr) html += `<div class="engage-views">${e.viewStr} 조회</div>`;
  const parts = [];
  if(e.engStr) parts.push(e.engStr);
  if(e.rate)   parts.push(`ER ${e.rate}`);
  if(parts.length) html += `<div class="engage-sub">${parts.join('<span class="engage-dot"></span>')}</div>`;
  html += '</div>';
  return html;
}

function shortPrice(s){
  if(!s) return '—';
  const f = s.split('\n')[0].trim();
  return f.length>30 ? f.substring(0,30)+'…' : f||'—';
}

function parseNum(s){
  if(!s) return 0;
  s = String(s).replace(/,/g,'').trim();
  if(/\d+\.?\d*M$/i.test(s)) return Math.round(parseFloat(s)*1000000);
  if(/\d+\.?\d*K$/i.test(s)) return Math.round(parseFloat(s)*1000);
  return parseInt(s)||0;
}

function fmtEngage(r){
  const v = parseNum(r.views);
  const l = parseNum(r.likes);
  const c = parseNum(r.comments);
  const s = parseNum(r.saves);
  const total = l + c + s;
  if(!v && !total) return null;
  const viewStr = v ? fmtN(v)+'회' : null;
  const engStr  = total ? fmtN(total)+'회 참여' : null;
  const rate    = (v && total) ? ((total/v)*100).toFixed(1)+'%' : null;
  return {viewStr, engStr, rate, total, v};
}

// ── FILTER / SORT ─────────────────────────────────────────────────────────────
function applyFilter(){
  let d = [...allData];
  switch(activeFilter){
    case 'agree': d=d.filter(r=>r.status==='Agree'); break;
    case 'nego':  d=d.filter(r=>r.status==='Nego'); break;
    case 'fup':   d=d.filter(r=>r.status==='Follow up'); break;
    case 'app':   d=d.filter(r=>r.status.startsWith('Approach')); break;
    case 'reply': d=d.filter(r=>r.status==='Reply'); break;
    case 'rc':    d=d.filter(r=>r.status==='Give Ratecard'); break;
    case 'rej':   d=d.filter(r=>['Reject','Non USA','Wrong Email'].includes(r.status)); break;
    case 'fast':  d=d.filter(r=>['Agree','Nego','Reply','Give Ratecard'].includes(r.status)); break;
    case 'skin':  d=d.filter(r=>catMatch(r,'skin')); break;
    case 'beauty':d=d.filter(r=>catMatch(r,'beauty')); break;
    case 'hair':  d=d.filter(r=>catMatch(r,'hair')); break;
    case 'life':  d=d.filter(r=>catMatch(r,'life')); break;
  }
  if(searchQ){
    const q=searchQ.toLowerCase();
    d=d.filter(r=>r.handle.toLowerCase().includes(q)||r.contact.toLowerCase().includes(q));
  }

  // range filters
  const {flMin,flMax,prMin,prMax}=getRanges();
  if(flMin>0||flMax<Infinity) d=d.filter(r=>r.followers>=flMin&&r.followers<=flMax);
  if(prMin>0||prMax<Infinity){
    d=d.filter(r=>{
      const p=parsePrice(r);
      if(p===null) return true; // 단가 미제시 = 범위 가능성 있음 → 포함
      return p>=prMin&&p<=prMax;
    });
  }
  updateRangeTags();
  if(sortCol){
    d.sort((a,b)=>{
      const av=sortCol==='followers'?a.followers:sortCol==='views'?parseNum(a.views):(a[sortCol]||'').toLowerCase();
      const bv=sortCol==='followers'?b.followers:sortCol==='views'?parseNum(b.views):(b[sortCol]||'').toLowerCase();
      if(typeof av==='number') return (bv-av)*sortDir;
      return av<bv?-sortDir:av>bv?sortDir:0;
    });
  } else {
    // Default: 실제 단가 있는 인플루언서 우선 → 그 다음 협상진행도 순
    const STATUS_PRI = {Agree:0,Nego:1,'Give Ratecard':2,Reply:3,'Follow up':4,'Approach Kbeauty':5,'Approach Staff':6,Approach:7,Reject:8,'Non USA':9,'Wrong Email':10};
    d.sort((a,b)=>{
      const ap = parsePrice(a)!==null ? 0 : 1;
      const bp = parsePrice(b)!==null ? 0 : 1;
      if(ap!==bp) return ap-bp;
      const as2 = STATUS_PRI[a.status]??99;
      const bs2 = STATUS_PRI[b.status]??99;
      return as2-bs2;
    });
  }
  filteredData=d; page=0;
  renderTable(); renderPag();

  const lbl = document.getElementById('result-lbl');
  if(lbl) lbl.textContent = filteredData.length.toLocaleString()+'건';

  document.querySelectorAll('thead th').forEach(th=>th.classList.remove('sort-asc','sort-desc'));
  if(sortCol){
    const ci={handle:1,followers:2,status:3}[sortCol];
    if(ci!=null){
      const th=document.querySelectorAll('thead th')[ci];
      if(th) th.classList.add(sortDir===1?'sort-asc':'sort-desc');
    }
  }
}

// ── PAGINATION ────────────────────────────────────────────────────────────────
function renderPag(){
  const total=Math.ceil(filteredData.length/PAGE_SIZE);
  const el=document.getElementById('pag-row');
  if(total<=1){el.innerHTML='';return;}

  const start=page*PAGE_SIZE+1;
  const end=Math.min((page+1)*PAGE_SIZE,filteredData.length);
  const W=2;
  let pages='';
  let prevDot=false;
  for(let p=0;p<total;p++){
    const near = p===0||p===total-1||(p>=page-W&&p<=page+W);
    if(near){
      prevDot=false;
      pages+=`<button class="pag-num${p===page?' cur':''}" onclick="goPage(${p})">${p+1}</button>`;
    } else if(!prevDot){
      prevDot=true;
      pages+=`<span class="pag-ellipsis">…</span>`;
    }
  }

  el.innerHTML=`
    <button class="pag-btn" onclick="goPage(${page-1})" ${page===0?'disabled':''}>← 이전</button>
    <div class="pag-pages">${pages}</div>
    <button class="pag-btn" onclick="goPage(${page+1})" ${page>=total-1?'disabled':''}>다음 →</button>
    <span style="margin-left:auto;color:var(--text2);font-size:11px">${start}–${end} / ${filteredData.length.toLocaleString()}건</span>`;
}

function goPage(p){
  const total=Math.ceil(filteredData.length/PAGE_SIZE);
  if(p<0||p>=total) return;
  page=p; renderTable(); renderPag();
  document.getElementById('table-wrap').scrollTop=0;
}

function openPipeline(){
  let ov = document.getElementById('pl-overlay');
  if(!ov){
    ov = buildPipelineOverlay();
    document.body.appendChild(ov);
  }
  requestAnimationFrame(()=>ov.classList.add('open'));
  plGoStage(1);
}

function closePipeline(){
  const ov = document.getElementById('pl-overlay');
  if(ov){ ov.classList.remove('open'); }
}

      <div class="r-av" style="background:${plColor(r.handle)};color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">${r.handle.slice(1,3).toUpperCase()}</div>

  return `<div class="push-stage">

  const avgER = posted.length ? (posted.reduce((s,r)=>s+r.er,0)/posted.length).toFixed(1) : 0;

  const cards = posted.map(r=>{
    const thumb = (kocMap[r.handle.replace('@','')]||{}).thumb || '';
    return `<div class="track-card">

  });

  return `<div class="track-stage">
    <div class="track-summary">
      <div class="track-stat"><div class="track-stat-val">${posted.length}</div><div class="track-stat-lbl">업로드 완료</div></div>
      <div class="track-stat"><div class="track-stat-val">${fmtNum(totalViews)}</div><div class="track-stat-lbl">총 조회수</div></div>
      <div class="track-stat"><div class="track-stat-val">${fmtNum(totalLikes)}</div><div class="track-stat-lbl">총 좋아요</div></div>
      <div class="track-stat"><div class="track-stat-val">${fmtNum(totalComments)}</div><div class="track-stat-lbl">총 댓글</div></div>
      <div class="track-stat"><div class="track-stat-val">${avgER}%</div><div class="track-stat-lbl">평균 ER</div></div>
    </div>
    <div class="track-toolbar">
      <input placeholder="@handle 또는 URL 검색...">
      <span style="font-size:12px;color:var(--text2)">플랫폼:</span>
      <button class="reply-btn" style="font-size:12px">전체</button>
      <button class="reply-btn" style="font-size:12px">TikTok</button>
      <button class="reply-btn" style="font-size:12px">Instagram</button>
      <button class="apify-btn" onclick="plApifyRefresh(this)">
        <span class="apify-icon">⟳</span> Apify 새로고침
      </button>
    </div>
    <div class="track-grid">${cards.join('')}</div>
  </div>`;
}

// ── Stage navigation ─────────────────────────────────────────────────
function plGoStage(n){
  PL_STAGE = n;
  for(let i=1;i<=5;i++){
    document.getElementById(`pl-stab-${i}`)?.classList.toggle('active',i===n);
    document.getElementById(`pl-sc-${i}`)?.classList.toggle('active',i===n);
  }
}

// ── Actions ──────────────────────────────────────────────────────────
function plSelectTmpl(id){
  PL_SELECTED_TMPL = PL_TEMPLATES.find(t=>t.id===id);
  document.querySelectorAll('.tmpl-card').forEach(el=>el.classList.remove('sel'));
  document.getElementById(`tc-${id}`)?.classList.add('sel');
  const subjEl = document.getElementById('pl-subj');
  const bodyEl = document.getElementById('pl-body');
  if(subjEl) subjEl.value = PL_SELECTED_TMPL.subject;
  if(bodyEl) bodyEl.value = PL_SELECTED_TMPL.body;
}

function plInsertVar(v){
  const ta = document.getElementById('pl-body');
  if(!ta) return;
  const s=ta.selectionStart, e=ta.selectionEnd;
  ta.value = ta.value.slice(0,s)+v+ta.value.slice(e);
  ta.setSelectionRange(s+v.length,s+v.length);
  ta.focus();
}

function plToggleRecip(handle, row){
  if(PL_SELECTED_IDS.has(handle)) PL_SELECTED_IDS.delete(handle);
  else PL_SELECTED_IDS.add(handle);
  row.classList.toggle('sel', PL_SELECTED_IDS.has(handle));
  const cb = row.querySelector('.r-check');
  if(cb) cb.checked = PL_SELECTED_IDS.has(handle);
  plUpdateSelCount();
}

function plSelectAll(){
  const rows = document.querySelectorAll('#recip-list .r-row');
  const allSel = PL_SELECTED_IDS.size >= PL_INFLUENCERS.filter(r=>r.status==='Agree').length;
  PL_SELECTED_IDS.clear();
  rows.forEach(row=>{
    const h = row.querySelector('.r-handle')?.textContent;
    if(!allSel && h){ PL_SELECTED_IDS.add(h); row.classList.add('sel'); row.querySelector('.r-check').checked=true; }
    else { row.classList.remove('sel'); row.querySelector('.r-check').checked=false; }
  });
  plUpdateSelCount();
}

function plUpdateSelCount(){
  const el = document.getElementById('sel-count-lbl');
  if(el) el.textContent = `${PL_SELECTED_IDS.size}명 선택`;
  const btn = document.getElementById('send-all-btn');
  if(btn) btn.disabled = PL_SELECTED_IDS.size === 0;
}

function plFilterRecip(q){
  document.querySelectorAll('#recip-list .r-row').forEach(row=>{
    const txt = row.textContent.toLowerCase();
    row.style.display = txt.includes(q.toLowerCase()) ? '' : 'none';
  });
}

function plSyncPreview(){ /* live editing — textarea already reactive */ }

async function plStartSend(){
  if(PL_SENDING || PL_SELECTED_IDS.size===0) return;
  PL_SENDING = true;
  const btn = document.getElementById('send-all-btn');
  const prog = document.getElementById('send-progress');
  const fill = document.getElementById('prog-fill');
  const lbl = document.getElementById('prog-lbl');
  if(btn) btn.style.display='none';
  if(prog) prog.classList.add('show');
  const total = PL_SELECTED_IDS.size;
  let done = 0;
  for(const handle of PL_SELECTED_IDS){
    await new Promise(r=>setTimeout(r, 280 + Math.random()*200));
    done++;
    const pct = Math.round(done/total*100);
    if(fill) fill.style.width = pct+'%';
    if(lbl) lbl.textContent = `${done}/${total} 발송 중... ${handle}`;
    const inf = PL_INFLUENCERS.find(r=>r.handle===handle);
    if(inf) inf.sent = true;
  }
  if(lbl) lbl.textContent = `✅ ${total}명 발송 완료!`;
  PL_SENDING = false;
  setTimeout(()=>{
    if(prog) prog.classList.remove('show');
    if(btn){ btn.style.display=''; btn.textContent='✓ 재발송'; }
  }, 2500);
}

function plResendEmail(handle){
  const inf = PL_INFLUENCERS.find(r=>r.handle===handle);
  if(!inf) return;
  const btn = event.target;
  btn.textContent='발송 중...';btn.disabled=true;
  setTimeout(()=>{ btn.textContent='✓ 발송됨'; inf.sent=true; },800);
}

function plConfirmShip(handle){
  const key = handle.replace('@','');
  const carrier = document.getElementById(`sc-${key}`)?.value;
  const tracking = document.getElementById(`st-${key}`)?.value;
  const inf = PL_INFLUENCERS.find(r=>r.handle===handle);
  if(!inf) return;
  inf.courier = carrier;
  inf.tracking = tracking;
  inf.shipped = true;
  inf.shipped_date = new Date().toISOString().slice(0,10);
  const badge = document.getElementById(`sb-${key}`);
  if(badge){ badge.textContent='발송완료'; badge.className='ship-state-badge shipped'; }
  const btn = document.getElementById(`shbtn-${key}`);
  if(btn){ btn.textContent='✓ 완료'; btn.className='ship-confirm-btn done'; btn.disabled=true; }
}

function plSendPush(handle){
  const key = handle.replace('@','');
  const inf = PL_INFLUENCERS.find(r=>r.handle===handle);
  if(!inf) return;
  const btn = document.getElementById(`pushbtn-${key}`);
  if(!btn || inf.push_sent) return;
  btn.textContent='발송 중...'; btn.disabled=true;
  setTimeout(()=>{
    inf.push_sent = true;
    btn.textContent='✓ 발송됨';
    btn.className='push-btn done';
  }, 700);
}

function plApifyRefresh(btn){
  btn.classList.add('loading');
  btn.querySelector('.apify-icon').textContent='⟳';
  setTimeout(()=>{
    btn.classList.remove('loading');
    btn.querySelector('.apify-icon').textContent='⟳';
    // Re-render stage 5 with updated kocMap data
    const sc5 = document.getElementById('pl-sc-5');
    if(sc5) sc5.innerHTML = buildStage5();
  }, 1500);
}

// ── Helpers ──────────────────────────────────────────────────────────
function fmtNum(n){
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(1)+'K';
  return n.toString();
}

const PL_PALETTE = ['#4A6CF0','#0FA65C','#E06820','#7052CC','#0888D0','#C28800'];
function plColor(handle){
  let h=0; for(const c of handle) h=(h*31+c.charCodeAt(0))%PL_PALETTE.length;
  return PL_PALETTE[Math.abs(h)%PL_PALETTE.length];
}
</script>
